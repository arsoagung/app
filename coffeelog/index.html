<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Coffeelog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #100b09;
    --bg-elevated: #1a1210;
    --bg-cell: #1e1512;
    --bg-cell-today: #2b1c15;
    --text: #f2e8e2;
    --text-secondary: #8c7b72;
    --text-tertiary: #55473f;
    --accent: #D97757;
    --accent-ink: #1c0f08;
    --hot-color: #c08858;
    --ice-color: #6fb3d9;
    --radius-cell: 18px;
    --radius-lg: 22px;
    --nav-height: 82px;
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }

  html, body{
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Plus Jakarta Sans', sans-serif;
    overscroll-behavior:none;
  }

  body{
    display:flex;
    justify-content:center;
    background:
      radial-gradient(circle at 50% 0%, #1c130f 0%, var(--bg) 55%);
  }

  .app{
    width:100%;
    max-width:430px;
    height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }

  .screens{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom: calc(var(--nav-height) + 10px);
  }

  .screen{ min-height:100%; display:flex; flex-direction:column; }

  /* ---------- Header ---------- */
  .header{
    padding:28px 22px 6px;
  }

  .header-top-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .eyebrow{
    font-size:13px;
    font-weight:500;
    color:var(--text-secondary);
    letter-spacing:0.02em;
  }

  .edit-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    padding:7px 13px;
    border-radius:12px;
    border:none;
    background:var(--bg-elevated);
    color:var(--text-secondary);
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    transition:background .18s ease, color .18s ease, transform .15s ease;
  }

  .edit-toggle svg{ width:14px; height:14px; }

  .edit-toggle:active{ transform:scale(0.95); }

  .edit-toggle.active{
    background:var(--accent);
    color:var(--accent-ink);
  }

  .month-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:10px;
  }

  .month-title{
    font-size:26px;
    font-weight:700;
    letter-spacing:-0.01em;
  }

  .month-nav{
    display:flex;
    gap:8px;
  }

  .year-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:16px;
  }

  .year-label{
    font-size:16px;
    font-weight:700;
    color:var(--text-secondary);
  }

  .stats-empty{
    padding:40px 22px;
    text-align:center;
    color:var(--text-secondary);
    font-size:13.5px;
    line-height:1.5;
  }

  .nav-btn{
    width:38px;
    height:38px;
    border-radius:12px;
    background:var(--bg-elevated);
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-secondary);
    transition:transform .15s ease, color .15s ease, background .15s ease;
  }

  .nav-btn:active{
    transform:scale(0.92);
    color:var(--accent);
    background:#241813;
  }

  .nav-btn svg{ width:18px; height:18px; }

  /* ---------- Legend ---------- */
  .legend{
    display:flex;
    gap:18px;
    padding:14px 22px 20px;
    color:var(--text-secondary);
    font-size:12.5px;
  }

  .legend-item{
    display:flex;
    align-items:center;
    gap:7px;
  }

  .legend-item img{ width:16px; height:16px; }

  /* ---------- Calendar ---------- */
  .calendar-wrap{
    padding:0 16px;
    flex:1;
  }

  .weekday-row{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    padding:0 4px 10px;
  }

  .weekday-row span{
    text-align:center;
    font-size:12px;
    font-weight:600;
    color:var(--text-tertiary);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:7px;
    transition:opacity .18s ease;
  }

  .grid.locked .cell:not(.empty){ opacity:0.9; }

  .cell{
    position:relative;
    aspect-ratio: 3 / 4;
    background:var(--bg-cell);
    border-radius:var(--radius-cell);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding-top:9px;
    transition:transform .12s ease, background .18s ease;
  }

  .cell.empty{ background:transparent; }

  .cell.today{ background:var(--bg-cell-today); }

  .cell.bounce{
    z-index:5;
    animation: cell-bounce .4s cubic-bezier(.34,1.56,.64,1);
  }

  @keyframes cell-bounce{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.18); }
    65%{ transform:scale(0.94); }
    100%{ transform:scale(1); }
  }

  .particle{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    pointer-events:none;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    animation: particle-burst .55s ease-out forwards;
  }

  @keyframes particle-burst{
    0%{ transform:translate(-50%,-50%) scale(1); opacity:1; }
    100%{ transform:translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity:0; }
  }

  .cell .num{
    font-size:13.5px;
    font-weight:600;
    color:var(--text-secondary);
    line-height:1;
  }

  .cell.today .num{ color:var(--accent); font-weight:700; }

  .cell .today-dot{
    position:absolute;
    top:7px;
    right:9px;
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--accent);
  }

  .cell .icon-wrap{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
  }

  .cell .icon-wrap img{
    width:58%;
    height:auto;
    opacity:0;
    transform:scale(0.6);
    transition:opacity .18s ease, transform .18s cubic-bezier(.34,1.56,.64,1);
  }

  .cell.filled .icon-wrap img{
    opacity:1;
    transform:scale(1);
  }

  /* ---------- Bottom nav (fixed, PWA style) ---------- */
  .bottom-nav{
    position:fixed;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:100%;
    max-width:430px;
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding:14px 26px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, rgba(16,11,9,0) 0%, var(--bg) 35%);
    z-index:20;
  }

  .nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    background:none;
    border:none;
    color:var(--text-tertiary);
    font-size:11px;
    font-weight:500;
    font-family:inherit;
    padding:8px 18px;
    border-radius:14px;
    transition:color .18s ease, background .18s ease;
  }

  .nav-item svg{ width:22px; height:22px; }

  .nav-item.active{
    color:var(--accent);
    background:var(--bg-elevated);
  }

  .hidden{ display:none !important; }

  /* ---------- Stats screen ---------- */
  .stats-summary{
    padding:8px 22px 20px;
  }

  .summary-card{
    background:var(--bg-elevated);
    border:1px solid rgba(242,232,226,0.06);
    border-radius:var(--radius-lg);
    padding:18px 16px;
    display:flex;
    align-items:center;
    gap:14px;
  }

  .summary-left{
    display:flex;
    align-items:center;
    gap:12px;
    flex:1;
    min-width:0;
  }

  .summary-icon-circle{
    width:44px;
    height:44px;
    flex-shrink:0;
    border-radius:50%;
    background:rgba(217,119,87,0.14);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .summary-icon-circle svg{ width:22px; height:22px; color:var(--accent); }

  .summary-count{ min-width:0; }

  .summary-number{
    font-size:26px;
    font-weight:800;
    letter-spacing:-0.01em;
    line-height:1;
  }

  .summary-label{
    margin-top:4px;
    font-size:11.5px;
    color:var(--text-secondary);
    font-weight:500;
  }

  .summary-divider{
    width:1px;
    align-self:stretch;
    background:rgba(242,232,226,0.08);
    flex-shrink:0;
  }

  .summary-right{
    display:flex;
    gap:18px;
    flex-shrink:0;
  }

  .summary-stat{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }

  .summary-stat-top{
    display:flex;
    align-items:center;
    gap:5px;
  }

  .summary-stat-top svg{ width:15px; height:15px; }
  .summary-stat.hot svg{ color:var(--hot-color); }
  .summary-stat.cold svg{ color:var(--ice-color); }

  .summary-stat-num{
    font-size:16px;
    font-weight:700;
  }

  .summary-stat-label{
    font-size:10.5px;
    color:var(--text-secondary);
    font-weight:500;
  }

  .section-title{
    font-size:13px;
    font-weight:600;
    color:var(--text-secondary);
  }

  .chart-section{
    padding:6px 22px 22px;
  }

  .chart-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }

  .chart-legend{
    display:flex;
    gap:14px;
    font-size:11.5px;
    color:var(--text-secondary);
  }

  .legend-dot{
    display:inline-flex;
    align-items:center;
    gap:5px;
  }

  .legend-dot::after{
    content:"";
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--dot-color);
  }

  .legend-dot.hot{ --dot-color: var(--hot-color); }
  .legend-dot.cold{ --dot-color: var(--ice-color); }

  .chart-wrap{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:4px;
    height:130px;
  }

  .month-track{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
    height:100%;
    background:none;
    border:none;
    padding:0;
    position:relative;
    font-family:inherit;
  }

  .track-bg{
    position:relative;
    width:9px;
    height:96px;
    border-radius:5px;
    background:var(--bg-elevated);
    display:flex;
    align-items:flex-end;
    overflow:visible;
    transition:width .18s ease, background .18s ease;
  }

  .month-track.selected .track-bg{
    width:11px;
    background:#241813;
  }

  .track-fill{
    width:100%;
    display:flex;
    flex-direction:column-reverse;
    border-radius:5px;
    overflow:hidden;
  }

  .fill-hot{ background:var(--hot-color); width:100%; }
  .fill-cold{ background:var(--ice-color); width:100%; }

  .track-dot{
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--text-tertiary);
    transition:background .18s ease, transform .18s ease;
  }

  .month-track.selected .track-dot{
    background:var(--accent);
    transform:scale(1.3);
  }

  .track-label{
    font-size:10px;
    font-weight:600;
    color:var(--text-tertiary);
    transition:color .18s ease;
  }

  .month-track.selected .track-label{ color:var(--text); }

  .track-tooltip{
    position:absolute;
    bottom:calc(100% + 10px);
    left:50%;
    transform:translateX(-50%);
    background:var(--bg-cell-today);
    border:1px solid rgba(242,232,226,0.1);
    border-radius:12px;
    padding:6px 10px;
    text-align:center;
    white-space:nowrap;
    box-shadow:0 6px 16px rgba(0,0,0,0.35);
    pointer-events:none;
    z-index:6;
  }

  .track-tooltip .t-month{
    display:block;
    font-size:10px;
    color:var(--text-secondary);
    font-weight:600;
  }

  .track-tooltip .t-value{
    display:block;
    font-size:14px;
    font-weight:800;
    color:var(--text);
    line-height:1.2;
  }

  .details-section{
    padding:0 22px 18px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .detail-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--bg-elevated);
    border-radius:18px;
    padding:16px;
    border:none;
    width:100%;
    text-align:left;
    font-family:inherit;
    color:inherit;
    transition:transform .12s ease;
  }

  .detail-card:active{ transform:scale(0.98); }

  .detail-left{ min-width:0; }

  .detail-month{
    font-size:15px;
    font-weight:700;
  }

  .detail-total{
    margin-top:5px;
    font-size:12.5px;
    color:var(--text-secondary);
  }

  .detail-breakdown{
    margin-top:2px;
    font-size:11.5px;
    color:var(--text-tertiary);
  }

  .detail-right{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }

  .detail-icons{
    display:flex;
  }

  .detail-icons img{
    width:20px;
    height:20px;
    margin-left:-6px;
    border-radius:50%;
    background:var(--bg);
    padding:2px;
  }

  .detail-icons img:first-child{ margin-left:0; }

  .detail-chevron{ width:16px; height:16px; color:var(--text-tertiary); flex-shrink:0; }

  .insight-card{
    display:flex;
    align-items:center;
    gap:12px;
    margin:0 22px 26px;
    padding:15px 16px;
    background:var(--bg-elevated);
    border-radius:16px;
  }

  .insight-icon{
    width:36px;
    height:36px;
    flex-shrink:0;
    border-radius:50%;
    background:rgba(217,119,87,0.14);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .insight-icon svg{ width:18px; height:18px; color:var(--accent); }

  .insight-headline{
    font-size:13px;
    font-weight:700;
  }

  .insight-sub{
    margin-top:2px;
    font-size:11.5px;
    color:var(--text-secondary);
  }

  /* ---------- Profile screen ---------- */
  .profile-body{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:56px 26px 30px;
    text-align:center;
  }

  .avatar{
    width:96px;
    height:96px;
    border-radius:50%;
    background:linear-gradient(160deg, #3a2419, #1a1210);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    font-weight:700;
    color:var(--accent);
    margin-bottom:18px;
  }

  .profile-name{ font-size:19px; font-weight:700; }
  .profile-email{ font-size:13px; color:var(--text-secondary); margin-top:4px; }

  .logout-btn{
    margin-top:36px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    padding:15px;
    border-radius:16px;
    border:none;
    background:var(--bg-elevated);
    color:var(--accent);
    font-family:inherit;
    font-size:14.5px;
    font-weight:600;
    transition:transform .15s ease, background .15s ease;
  }

  .logout-btn:active{ transform:scale(0.97); background:#241813; }
  .logout-btn svg{ width:18px; height:18px; }

  .avatar img{ width:100%; height:100%; border-radius:50%; object-fit:cover; }

  /* ---------- Login screen ---------- */
  .app-shell{
    display:flex;
    flex-direction:column;
    height:100%;
  }

  .login-screen{
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:40px;
    text-align:center;
  }

  .login-eyebrow{
    font-size:13px;
    font-weight:500;
    color:var(--text-secondary);
    letter-spacing:0.02em;
  }

  .login-title{
    font-size:24px;
    font-weight:800;
    letter-spacing:-0.01em;
    max-width:260px;
    line-height:1.3;
  }

  .google-btn{
    margin-top:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:14px 22px;
    border-radius:16px;
    border:none;
    background:var(--bg-elevated);
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    transition:transform .15s ease, background .15s ease;
  }

  .google-btn:active{ transform:scale(0.97); background:#241813; }

  .loading-text{
    color:var(--text-tertiary);
    font-size:12.5px;
  }
</style>
</head>
<body>

<div class="app">

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="login-screen">
    <div class="login-eyebrow">Coffeelog</div>
    <div class="login-title">Track your daily drinks</div>
    <button id="googleLoginBtn" class="google-btn">
      <svg viewBox="0 0 48 48" width="18" height="18">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.6 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.4 5.1 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.4-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.8 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.4 6.1 29.5 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.3 0 10.1-2 13.7-5.4l-6.3-5.3C29.3 34.9 26.8 36 24 36c-5.3 0-9.8-3.4-11.4-8.1l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.4-2.4 4.4-4.4 5.8l6.3 5.3C40.9 36.6 43 30.9 43 24c0-1.4-.1-2.4-.4-3.5z"/>
      </svg>
      Continue with Google
    </button>
  </div>

  <div id="appShell" class="app-shell hidden">

  <div class="screens">

    <!-- CALENDAR SCREEN -->
    <div id="screen-calendar" class="screen">
      <div class="header">
        <div class="header-top-row">
          <div class="eyebrow">Coffeelog</div>
          <button class="edit-toggle" id="editToggle" aria-label="Toggle edit mode">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
            <span id="editLabel">Edit</span>
          </button>
        </div>
        <div class="month-row">
          <div class="month-title" id="monthTitle">September 2026</div>
          <div class="month-nav">
            <button class="nav-btn" id="prevBtn" aria-label="Previous month">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <button class="nav-btn" id="nextBtn" aria-label="Next month">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>
        </div>

  function showApp(user){
    currentUser = user;
    loginScreenEl.classList.add('hidden');
    appShellEl.classList.remove('hidden');

    const meta = user.user_metadata || {};
    const name = meta.full_name || meta.name || user.email || 'Coffeelog user';
    document.getElementById('profileName').textContent = name;
    document.getElementById('profileEmail').textContent = user.email || '';

    const avatarEl = document.getElementById('profileAvatar');
    if(meta.avatar_url){
      avatarEl.innerHTML = `<img src="${meta.avatar_url}" alt="${name}">`;
    } else {
      avatarEl.textContent = name.charAt(0).toUpperCase();
    }

    loadMonthEntries();
    loadYearStats();
  }

  function showLogin(){
    currentUser = null;
    appShellEl.classList.add('hidden');
    loginScreenEl.classList.remove('hidden');
  }

  sb.auth.getSession().then(({ data: { session } }) => {
    if(session && session.user){ showApp(session.user); } else { showLogin(); }
  });

  sb.auth.onAuthStateChange((_event, session) => {
    if(session && session.user){ showApp(session.user); } else { showLogin(); }
  });

  // ---------- Calendar state ----------
  const STATE_ORDER = [null, 'hot', 'ice'];
  const today = new Date();
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth(); // 0-indexed
  let editMode = false;

  // in-memory cache of the currently viewed month's entries: { "YYYY-M-D": "hot" | "ice" }
  const coffeeLog = {};

  const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  const gridEl = document.getElementById('grid');
  const monthTitleEl = document.getElementById('monthTitle');
  const editToggleBtn = document.getElementById('editToggle');
  const editLabelEl = document.getElementById('editLabel');
  const calendarWrapEl = document.getElementById('calendarWrap');

  function keyFor(y,m,d){ return `${y}-${m}-${d}`; }

  function burstParticles(cell){
    const colors = ['var(--accent)', 'var(--hot-color)', 'var(--ice-color)', '#ffffff'];
    const count = 10;
    for(let i=0; i<count; i++){
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
      const dist = 24 + Math.random() * 16;
      p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
      p.style.background = colors[i % colors.length];
      cell.appendChild(p);
      p.addEventListener('animationend', () => p.remove());
    }
  }

  function isoDate(y, m, d){
    return `${y}-${String(m + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  async function markAndAnimate(k, d){
    const current = coffeeLog[k] || null;
    const idx = STATE_ORDER.indexOf(current);
    const next = STATE_ORDER[(idx + 1) % STATE_ORDER.length];
    if(next) coffeeLog[k] = next; else delete coffeeLog[k];
    render();
    const newCell = gridEl.querySelector(`[data-day="${d}"]`);
    if(newCell){
      newCell.classList.add('bounce');
      burstParticles(newCell);
      setTimeout(() => newCell.classList.remove('bounce'), 400);
    }

    if(!currentUser) return;
    const dateStr = isoDate(viewYear, viewMonth, d);

    if(next){
      await sb.from('coffee_entries').upsert(
        { user_id: currentUser.id, entry_date: dateStr, drink_type: next },
        { onConflict: 'user_id,entry_date' }
      );
    } else {
      await sb.from('coffee_entries')
        .delete()
        .eq('user_id', currentUser.id)
        .eq('entry_date', dateStr);
    }
  }

  async function loadMonthEntries(){
    if(!currentUser) return;
    const start = isoDate(viewYear, viewMonth, 1);
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const end = isoDate(viewYear, viewMonth, daysInMonth);

    const { data, error } = await sb.from('coffee_entries')
      .select('entry_date, drink_type')
      .eq('user_id', currentUser.id)
      .gte('entry_date', start)
      .lte('entry_date', end);

    Object.keys(coffeeLog).forEach(key => delete coffeeLog[key]);
    if(!error && data){
      data.forEach(row => {
        const [y, m, d] = row.entry_date.split('-').map(Number);
        coffeeLog[keyFor(y, m - 1, d)] = row.drink_type;
      });
    }
    render();
  }

  function render(){
    monthTitleEl.textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;
    gridEl.innerHTML = '';

    const firstDay = new Date(viewYear, viewMonth, 1).getDay(); // 0 = Sunday
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

    for(let i=0; i<firstDay; i++){
      const empty = document.createElement('div');
      empty.className = 'cell empty';
      gridEl.appendChild(empty);
    }

    for(let d=1; d<=daysInMonth; d++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.day = d;

      const isToday = viewYear === today.getFullYear() && viewMonth === today.getMonth() && d === today.getDate();
      if(isToday) cell.classList.add('today');

      const k = keyFor(viewYear, viewMonth, d);
      const state = coffeeLog[k];
      if(state) cell.classList.add('filled');

      const num = document.createElement('div');
      num.className = 'num';
      num.textContent = d;
      cell.appendChild(num);

      if(isToday){
        const dot = document.createElement('div');
        dot.className = 'today-dot';
        cell.appendChild(dot);
      }

      const iconWrap = document.createElement('div');
      iconWrap.className = 'icon-wrap';
      if(state === 'hot'){
        iconWrap.innerHTML = `<img src="${ICON_HOT}" alt="Hot drink">`;
      } else if(state === 'ice'){
        iconWrap.innerHTML = `<img src="${ICON_ICE}" alt="Cold drink">`;
      }
      cell.appendChild(iconWrap);

      cell.addEventListener('click', () => {
        if(!editMode) return;
        markAndAnimate(k, d);
      });

      gridEl.appendChild(cell);
    }
  }

  function goToPrevMonth(){
    viewMonth--;
    if(viewMonth < 0){ viewMonth = 11; viewYear--; }
    loadMonthEntries();
  }

  function goToNextMonth(){
    viewMonth++;
    if(viewMonth > 11){ viewMonth = 0; viewYear++; }
    loadMonthEntries();
  }

  document.getElementById('prevBtn').addEventListener('click', goToPrevMonth);
  document.getElementById('nextBtn').addEventListener('click', goToNextMonth);

  // ---------- Edit mode toggle ----------
  editToggleBtn.addEventListener('click', () => {
    editMode = !editMode;
    editToggleBtn.classList.toggle('active', editMode);
    editLabelEl.textContent = editMode ? 'Editing' : 'Edit';
    gridEl.classList.toggle('locked', !editMode);
  });

  // ---------- Swipe to change month (only when edit mode is off) ----------
  let touchStartX = 0, touchStartY = 0;

  calendarWrapEl.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  calendarWrapEl.addEventListener('touchend', (e) => {
    if(editMode) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4){
      if(dx > 0){ goToNextMonth(); } else { goToPrevMonth(); }
    }
  }, { passive: true });

  // ---------- Yearly stats (queried from coffee_entries, grouped client-side) ----------
  let statsYear = today.getFullYear();

  const statsYearLabelEl = document.getElementById('statsYearLabel');

  const insightSubEl = document.getElementById('insightSub');

  const MONTH_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  async function loadYearStats(){
    if(!currentUser) return;
    statsYearLabelEl.textContent = statsYear;

    const start = `${statsYear}-01-01`;
    const end = `${statsYear}-12-31`;

    const { data, error } = await sb.from('coffee_entries')
      .select('entry_date, drink_type')
      .eq('user_id', currentUser.id)
      .gte('entry_date', start)
      .lte('entry_date', end);

    const monthly = MONTH_NAMES.map(name => ({ month: name, hot: 0, ice: 0 }));
    if(!error && data){
      data.forEach(row => {
        const monthIdx = Number(row.entry_date.split('-')[1]) - 1;
        if(row.drink_type === 'hot') monthly[monthIdx].hot++;
        else if(row.drink_type === 'ice') monthly[monthIdx].ice++;
      });
    }

    // pick a sensible default selected month: today's month if viewing the
    // current year, otherwise the last month in that year with any activity
    if(statsYear === today.getFullYear()){
      selectedMonthIdx = today.getMonth();
    } else {
      let lastActive = -1;
      monthly.forEach((m, i) => { if(m.hot + m.ice > 0) lastActive = i; });
      selectedMonthIdx = lastActive >= 0 ? lastActive : 11;
    }

    renderStats(monthly);
  }

  function renderStats(monthly){
    const totalHot = monthly.reduce((s,m) => s + m.hot, 0);
    const totalIce = monthly.reduce((s,m) => s + m.ice, 0);
    document.getElementById('totalHot').textContent = totalHot;
    document.getElementById('totalIce').textContent = totalIce;
    document.getElementById('totalAll').textContent = totalHot + totalIce;

    renderChart(monthly);
    renderDetail(monthly[selectedMonthIdx], selectedMonthIdx);
    renderInsight(totalHot + totalIce);
  }

  function renderChart(monthly){
    const maxTotal = Math.max(1, ...monthly.map(m => m.hot + m.ice));
    const maxPx = 96;

    monthChartEl.innerHTML = '';

    monthly.forEach((m, i) => {
      const total = m.hot + m.ice;
      const hotPx = (m.hot / maxTotal) * maxPx;
      const icePx = (m.ice / maxTotal) * maxPx;
      const fillPx = hotPx + icePx;
      const isSelected = i === selectedMonthIdx;

      const track = document.createElement('button');
      track.type = 'button';
      track.className = 'month-track' + (isSelected ? ' selected' : '');
      track.setAttribute('aria-label', `${MONTH_NAMES[i]}: ${total} drinks`);

      track.innerHTML = `
        <div class="track-bg">
          <div class="track-fill" style="height:${fillPx}px">
            <div class="fill-cold" style="height:${icePx}px"></div>
            <div class="fill-hot" style="height:${hotPx}px"></div>
          </div>
          ${isSelected ? `<div class="track-tooltip"><span class="t-month">${MONTH_SHORT[i]}</span><span class="t-value">${total}</span></div>` : ''}
        </div>
        <span class="track-dot"></span>
        <span class="track-label">${MONTH_SHORT[i]}</span>
      `;

      track.addEventListener('click', () => {
        if(selectedMonthIdx === i) return;
        selectedMonthIdx = i;
        renderChart(monthly);
        renderDetail(monthly[selectedMonthIdx], selectedMonthIdx);
      });

      monthChartEl.appendChild(track);
    });
  }

  function renderDetail(m, idx){
    const total = m.hot + m.ice;
    detailMonthEl.textContent = MONTH_NAMES[idx];

    if(total === 0){
      detailTotalEl.textContent = 'No drinks yet';
      detailBreakdownEl.textContent = 'Tap a day on the calendar to log one';
      detailIconsEl.innerHTML = '';
      return;
    }

    detailTotalEl.textContent = `${total} drink${total === 1 ? '' : 's'}`;
    detailBreakdownEl.textContent = `${m.hot} hot · ${m.ice} cold`;

    const icons = [];
    for(let i = 0; i < m.hot && icons.length < 4; i++) icons.push(ICON_HOT);
    for(let i = 0; i < m.ice && icons.length < 4; i++) icons.push(ICON_ICE);
    detailIconsEl.innerHTML = icons.map(src => `<img src="${src}" alt="">`).join('');
  }

  function renderInsight(totalAll){
    let headline;
    if(totalAll === 0) headline = 'Ready when you are.';
    else if(totalAll < 5) headline = 'Small steps, good sips.';
    else if(totalAll < 15) headline = 'Building a nice little habit.';
    else headline = 'Certified coffee enthusiast.';

    insightHeadlineEl.textContent = headline;
    insightSubEl.textContent = totalAll === 0
      ? `No drinks logged in ${statsYear} yet.`
      : `You logged ${totalAll} drink${totalAll === 1 ? '' : 's'} in ${statsYear}.`;
  }

  document.getElementById('statsPrevYear').addEventListener('click', () => {
    statsYear--;
    loadYearStats();
  });

  document.getElementById('statsNextYear').addEventListener('click', () => {
    statsYear++;
    loadYearStats();
  });

  // ---------- Bottom nav switching ----------
  const screens = {
    calendar: document.getElementById('screen-calendar'),
    stats: document.getElementById('screen-stats'),
    profile: document.getElementById('screen-profile'),
  };
  const navItems = document.querySelectorAll('.nav-item');
  const screensWrap = document.querySelector('.screens');

  navItems.forEach(item => {
    item.addEventListener('click', () => {
      navItems.forEach(n => n.classList.remove('active'));
      item.classList.add('active');
      const target = item.dataset.target;
      Object.keys(screens).forEach(key => {
        screens[key].classList.toggle('hidden', key !== target);
      });
      screensWrap.scrollTop = 0;
      if(target === 'stats') loadYearStats();
    });
  });
</script>

</body>
</html>
