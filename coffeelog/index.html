<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Coffeelog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #100b09;
    --bg-elevated: #1a1210;
    --bg-cell: #1e1512;
    --bg-cell-today: #2b1c15;
    --text: #f2e8e2;
    --text-secondary: #8c7b72;
    --text-tertiary: #55473f;
    --accent: #D97757;
    --accent-ink: #1c0f08;
    --hot-color: #c08858;
    --ice-color: #6fb3d9;
    --radius-cell: 18px;
    --radius-lg: 22px;
    --nav-height: 82px;
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }

  html, body{
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Plus Jakarta Sans', sans-serif;
    overscroll-behavior:none;
  }

  body{
    display:flex;
    justify-content:center;
    background:
      radial-gradient(circle at 50% 0%, #1c130f 0%, var(--bg) 55%);
  }

  .app{
    width:100%;
    max-width:430px;
    height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }

  .screens{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom: calc(var(--nav-height) + 10px);
  }

  .screen{ min-height:100%; display:flex; flex-direction:column; }

  /* ---------- Header ---------- */
  .header{
    padding:28px 22px 6px;
  }

  .header-top-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .eyebrow{
    font-size:13px;
    font-weight:500;
    color:var(--text-secondary);
    letter-spacing:0.02em;
  }

  .edit-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    padding:7px 13px;
    border-radius:12px;
    border:none;
    background:var(--bg-elevated);
    color:var(--text-secondary);
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    transition:background .18s ease, color .18s ease, transform .15s ease;
  }

  .edit-toggle svg{ width:14px; height:14px; }

  .edit-toggle:active{ transform:scale(0.95); }

  .edit-toggle.active{
    background:var(--accent);
    color:var(--accent-ink);
  }

  .month-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:10px;
  }

  .month-title{
    font-size:26px;
    font-weight:700;
    letter-spacing:-0.01em;
  }

  .month-nav{
    display:flex;
    gap:8px;
  }

  .year-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:16px;
  }

  .year-label{
    font-size:16px;
    font-weight:700;
    color:var(--text-secondary);
  }

  .stats-empty{
    padding:40px 22px;
    text-align:center;
    color:var(--text-secondary);
    font-size:13.5px;
    line-height:1.5;
  }

  .nav-btn{
    width:38px;
    height:38px;
    border-radius:12px;
    background:var(--bg-elevated);
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-secondary);
    transition:transform .15s ease, color .15s ease, background .15s ease;
  }

  .nav-btn:active{
    transform:scale(0.92);
    color:var(--accent);
    background:#241813;
  }

  .nav-btn svg{ width:18px; height:18px; }

  /* ---------- Legend ---------- */
  .legend{
    display:flex;
    gap:18px;
    padding:14px 22px 20px;
    color:var(--text-secondary);
    font-size:12.5px;
  }

  .legend-item{
    display:flex;
    align-items:center;
    gap:7px;
  }

  .legend-item img{ width:16px; height:16px; }

  /* ---------- Calendar ---------- */
  .calendar-wrap{
    padding:0 16px;
    flex:1;
  }

  .weekday-row{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    padding:0 4px 10px;
  }

  .weekday-row span{
    text-align:center;
    font-size:12px;
    font-weight:600;
    color:var(--text-tertiary);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:7px;
    transition:opacity .18s ease;
  }

  .grid.locked .cell:not(.empty){ opacity:0.9; }

  .cell{
    position:relative;
    aspect-ratio: 3 / 4;
    background:var(--bg-cell);
    border-radius:var(--radius-cell);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding-top:9px;
    transition:transform .12s ease, background .18s ease;
  }

  .cell.empty{ background:transparent; }

  .cell.today{ background:var(--bg-cell-today); }

  .cell.bounce{
    z-index:5;
    animation: cell-bounce .4s cubic-bezier(.34,1.56,.64,1);
  }

  @keyframes cell-bounce{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.18); }
    65%{ transform:scale(0.94); }
    100%{ transform:scale(1); }
  }

  .particle{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    pointer-events:none;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    animation: particle-burst .55s ease-out forwards;
  }

  @keyframes particle-burst{
    0%{ transform:translate(-50%,-50%) scale(1); opacity:1; }
    100%{ transform:translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity:0; }
  }

  .cell .num{
    font-size:13.5px;
    font-weight:600;
    color:var(--text-secondary);
    line-height:1;
  }

  .cell.today .num{ color:var(--accent); font-weight:700; }

  .cell .today-dot{
    position:absolute;
    top:7px;
    right:9px;
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--accent);
  }

  .cell .icon-wrap{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
  }

  .cell .icon-wrap img{
    width:58%;
    height:auto;
    opacity:0;
    transform:scale(0.6);
    transition:opacity .18s ease, transform .18s cubic-bezier(.34,1.56,.64,1);
  }

  .cell.filled .icon-wrap img{
    opacity:1;
    transform:scale(1);
  }

  /* ---------- Bottom nav (fixed, PWA style) ---------- */
  .bottom-nav{
    position:fixed;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:100%;
    max-width:430px;
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding:14px 26px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, rgba(16,11,9,0) 0%, var(--bg) 35%);
    z-index:20;
  }

  .nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    background:none;
    border:none;
    color:var(--text-tertiary);
    font-size:11px;
    font-weight:500;
    font-family:inherit;
    padding:8px 18px;
    border-radius:14px;
    transition:color .18s ease, background .18s ease;
  }

  .nav-item svg{ width:22px; height:22px; }

  .nav-item.active{
    color:var(--accent);
    background:var(--bg-elevated);
  }

  .hidden{ display:none !important; }

  /* ---------- Stats screen ---------- */
  .stats-summary{
    display:flex;
    gap:10px;
    padding:8px 22px 22px;
  }

  .summary-card{
    flex:1;
    background:var(--bg-elevated);
    border-radius:var(--radius-lg);
    padding:16px 14px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .summary-card img{ width:20px; height:20px; }

  .summary-card .num{
    font-size:22px;
    font-weight:800;
    letter-spacing:-0.01em;
  }

  .summary-card .lbl{
    font-size:11.5px;
    color:var(--text-secondary);
    font-weight:500;
  }

  .stats-list{
    padding:0 22px 30px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .stats-list-title{
    font-size:13px;
    font-weight:600;
    color:var(--text-secondary);
    margin-bottom:2px;
  }

  .month-row-stat{
    display:flex;
    flex-direction:column;
    gap:7px;
  }

  .month-row-stat .top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:13px;
  }

  .month-row-stat .top .mname{
    font-weight:600;
    color:var(--text);
  }

  .month-row-stat .top .mtotal{
    font-size:11.5px;
    color:var(--text-tertiary);
  }

  .bar-track{
    display:flex;
    width:100%;
    height:9px;
    border-radius:5px;
    overflow:hidden;
    background:var(--bg-elevated);
  }

  .bar-hot{ background:var(--hot-color); height:100%; }
  .bar-ice{ background:var(--ice-color); height:100%; }

  .month-row-stat .counts{
    display:flex;
    gap:14px;
    font-size:11px;
    color:var(--text-secondary);
  }

  .count-chip{ display:flex; align-items:center; gap:5px; }
  .count-dot{ width:7px; height:7px; border-radius:2px; }
  .count-dot.hot{ background:var(--hot-color); }
  .count-dot.ice{ background:var(--ice-color); }

  /* ---------- Profile screen ---------- */
  .profile-body{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:56px 26px 30px;
    text-align:center;
  }

  .avatar{
    width:96px;
    height:96px;
    border-radius:50%;
    background:linear-gradient(160deg, #3a2419, #1a1210);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    font-weight:700;
    color:var(--accent);
    margin-bottom:18px;
  }

  .profile-name{ font-size:19px; font-weight:700; }
  .profile-email{ font-size:13px; color:var(--text-secondary); margin-top:4px; }

  .logout-btn{
    margin-top:36px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    padding:15px;
    border-radius:16px;
    border:none;
    background:var(--bg-elevated);
    color:var(--accent);
    font-family:inherit;
    font-size:14.5px;
    font-weight:600;
    transition:transform .15s ease, background .15s ease;
  }

  .logout-btn:active{ transform:scale(0.97); background:#241813; }
  .logout-btn svg{ width:18px; height:18px; }

  .avatar img{ width:100%; height:100%; border-radius:50%; object-fit:cover; }

  /* ---------- Login screen ---------- */
  .app-shell{
    display:flex;
    flex-direction:column;
    height:100%;
  }

  .login-screen{
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:40px;
    text-align:center;
  }

  .login-eyebrow{
    font-size:13px;
    font-weight:500;
    color:var(--text-secondary);
    letter-spacing:0.02em;
  }

  .login-title{
    font-size:24px;
    font-weight:800;
    letter-spacing:-0.01em;
    max-width:260px;
    line-height:1.3;
  }

  .google-btn{
    margin-top:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:14px 22px;
    border-radius:16px;
    border:none;
    background:var(--bg-elevated);
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    transition:transform .15s ease, background .15s ease;
  }

  .google-btn:active{ transform:scale(0.97); background:#241813; }

  .loading-text{
    color:var(--text-tertiary);
    font-size:12.5px;
  }
</style>
</head>

  // ---------- Supabase ----------
  const SUPABASE_URL = 'https://obpnztfbeqnbamiwbagu.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9icG56dGZiZXFuYmFtaXdiYWd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTcxMDcsImV4cCI6MjA4OTIzMzEwN30.9rIhs62HTxEqUqS6ut9dU3h7QTmvkl-k5-osFY85y44';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;

  const loginScreenEl = document.getElementById('loginScreen');
  const appShellEl = document.getElementById('appShell');
  const googleLoginBtn = document.getElementById('googleLoginBtn');
  const logoutBtn = document.getElementById('logoutBtn');

  googleLoginBtn.addEventListener('click', () => {
    sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.href }
    });
  });

  logoutBtn.addEventListener('click', async () => {
    await sb.auth.signOut();
  });

  function showApp(user){
    currentUser = user;
    loginScreenEl.classList.add('hidden');
    appShellEl.classList.remove('hidden');

    const meta = user.user_metadata || {};
    const name = meta.full_name || meta.name || user.email || 'Coffeelog user';
    document.getElementById('profileName').textContent = name;
    document.getElementById('profileEmail').textContent = user.email || '';

    const avatarEl = document.getElementById('profileAvatar');
    if(meta.avatar_url){
      avatarEl.innerHTML = `<img src="${meta.avatar_url}" alt="${name}">`;
    } else {
      avatarEl.textContent = name.charAt(0).toUpperCase();
    }

    loadMonthEntries();
    loadYearStats();
  }

  function showLogin(){
    currentUser = null;
    appShellEl.classList.add('hidden');
    loginScreenEl.classList.remove('hidden');
  }

  sb.auth.getSession().then(({ data: { session } }) => {
    if(session && session.user){ showApp(session.user); } else { showLogin(); }
  });

  sb.auth.onAuthStateChange((_event, session) => {
    if(session && session.user){ showApp(session.user); } else { showLogin(); }
  });

  // ---------- Calendar state ----------
  const STATE_ORDER = [null, 'hot', 'ice'];
  const today = new Date();
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth(); // 0-indexed
  let editMode = false;

  // in-memory cache of the currently viewed month's entries: { "YYYY-M-D": "hot" | "ice" }
  const coffeeLog = {};

  const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  const gridEl = document.getElementById('grid');
  const monthTitleEl = document.getElementById('monthTitle');
  const editToggleBtn = document.getElementById('editToggle');
  const editLabelEl = document.getElementById('editLabel');
  const calendarWrapEl = document.getElementById('calendarWrap');

  function keyFor(y,m,d){ return `${y}-${m}-${d}`; }

  function burstParticles(cell){
    const colors = ['var(--accent)', 'var(--hot-color)', 'var(--ice-color)', '#ffffff'];
    const count = 10;
    for(let i=0; i<count; i++){
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
      const dist = 24 + Math.random() * 16;
      p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
      p.style.background = colors[i % colors.length];
      cell.appendChild(p);
      p.addEventListener('animationend', () => p.remove());
    }
  }

  function isoDate(y, m, d){
    return `${y}-${String(m + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  async function markAndAnimate(k, d){
    const current = coffeeLog[k] || null;
    const idx = STATE_ORDER.indexOf(current);
    const next = STATE_ORDER[(idx + 1) % STATE_ORDER.length];
    if(next) coffeeLog[k] = next; else delete coffeeLog[k];
    render();
    const newCell = gridEl.querySelector(`[data-day="${d}"]`);
    if(newCell){
      newCell.classList.add('bounce');
      burstParticles(newCell);
      setTimeout(() => newCell.classList.remove('bounce'), 400);
    }

    if(!currentUser) return;
    const dateStr = isoDate(viewYear, viewMonth, d);

    if(next){
      await sb.from('coffee_entries').upsert(
        { user_id: currentUser.id, entry_date: dateStr, drink_type: next },
        { onConflict: 'user_id,entry_date' }
      );
    } else {
      await sb.from('coffee_entries')
        .delete()
        .eq('user_id', currentUser.id)
        .eq('entry_date', dateStr);
    }
  }

  async function loadMonthEntries(){
    if(!currentUser) return;
    const start = isoDate(viewYear, viewMonth, 1);
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const end = isoDate(viewYear, viewMonth, daysInMonth);

    const { data, error } = await sb.from('coffee_entries')
      .select('entry_date, drink_type')
      .eq('user_id', currentUser.id)
      .gte('entry_date', start)
      .lte('entry_date', end);

    Object.keys(coffeeLog).forEach(key => delete coffeeLog[key]);
    if(!error && data){
      data.forEach(row => {
        const [y, m, d] = row.entry_date.split('-').map(Number);
        coffeeLog[keyFor(y, m - 1, d)] = row.drink_type;
      });
    }
    render();
  }

  function render(){
    monthTitleEl.textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;
    gridEl.innerHTML = '';

    const firstDay = new Date(viewYear, viewMonth, 1).getDay(); // 0 = Sunday
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

    for(let i=0; i<firstDay; i++){
      const empty = document.createElement('div');
      empty.className = 'cell empty';
      gridEl.appendChild(empty);
    }

    for(let d=1; d<=daysInMonth; d++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.day = d;

      const isToday = viewYear === today.getFullYear() && viewMonth === today.getMonth() && d === today.getDate();
      if(isToday) cell.classList.add('today');

      const k = keyFor(viewYear, viewMonth, d);
      const state = coffeeLog[k];
      if(state) cell.classList.add('filled');

      const num = document.createElement('div');
      num.className = 'num';
      num.textContent = d;
      cell.appendChild(num);

      if(isToday){
        const dot = document.createElement('div');
        dot.className = 'today-dot';
        cell.appendChild(dot);
      }

      const iconWrap = document.createElement('div');
      iconWrap.className = 'icon-wrap';
      if(state === 'hot'){
        iconWrap.innerHTML = `<img src="${ICON_HOT}" alt="Hot drink">`;
      } else if(state === 'ice'){
        iconWrap.innerHTML = `<img src="${ICON_ICE}" alt="Ice drink">`;
      }
      cell.appendChild(iconWrap);

      cell.addEventListener('click', () => {
        if(!editMode) return;
        markAndAnimate(k, d);
      });

      gridEl.appendChild(cell);
    }
  }

  function goToPrevMonth(){
    viewMonth--;
    if(viewMonth < 0){ viewMonth = 11; viewYear--; }
    loadMonthEntries();
  }

  function goToNextMonth(){
    viewMonth++;
    if(viewMonth > 11){ viewMonth = 0; viewYear++; }
    loadMonthEntries();
  }

  document.getElementById('prevBtn').addEventListener('click', goToPrevMonth);
  document.getElementById('nextBtn').addEventListener('click', goToNextMonth);

  // ---------- Edit mode toggle ----------
  editToggleBtn.addEventListener('click', () => {
    editMode = !editMode;
    editToggleBtn.classList.toggle('active', editMode);
    editLabelEl.textContent = editMode ? 'Editing' : 'Edit';
    gridEl.classList.toggle('locked', !editMode);
  });

  // ---------- Swipe to change month (only when edit mode is off) ----------
  let touchStartX = 0, touchStartY = 0;

  calendarWrapEl.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  calendarWrapEl.addEventListener('touchend', (e) => {
    if(editMode) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4){
      if(dx > 0){ goToNextMonth(); } else { goToPrevMonth(); }
    }
  }, { passive: true });

  // ---------- Yearly stats (queried from coffee_entries, grouped client-side) ----------
  let statsYear = today.getFullYear();

  const statsYearLabelEl = document.getElementById('statsYearLabel');
  const statsListEl = document.getElementById('statsMonthList');

  async function loadYearStats(){
    if(!currentUser) return;
    statsYearLabelEl.textContent = statsYear;

    const start = `${statsYear}-01-01`;
    const end = `${statsYear}-12-31`;

    const { data, error } = await sb.from('coffee_entries')
      .select('entry_date, drink_type')
      .eq('user_id', currentUser.id)
      .gte('entry_date', start)
      .lte('entry_date', end);

    if(error || !data || data.length === 0){
      document.getElementById('totalHot').textContent = 0;
      document.getElementById('totalIce').textContent = 0;
      document.getElementById('totalAll').textContent = 0;
      statsListEl.innerHTML = `<div class="stats-empty">No drinks logged in ${statsYear} yet.</div>`;
      return;
    }

    const monthly = MONTH_NAMES.map(name => ({ month: name, hot: 0, ice: 0 }));
    data.forEach(row => {
      const monthIdx = Number(row.entry_date.split('-')[1]) - 1;
      if(row.drink_type === 'hot') monthly[monthIdx].hot++;
      else if(row.drink_type === 'ice') monthly[monthIdx].ice++;
    });

    renderStats(monthly);
  }

  function renderStats(monthly){
    const totalHot = monthly.reduce((s,m) => s + m.hot, 0);
    const totalIce = monthly.reduce((s,m) => s + m.ice, 0);
    document.getElementById('totalHot').textContent = totalHot;
    document.getElementById('totalIce').textContent = totalIce;
    document.getElementById('totalAll').textContent = totalHot + totalIce;

    const maxTotal = Math.max(1, ...monthly.map(m => m.hot + m.ice));
    statsListEl.innerHTML = '';

    monthly.forEach(m => {
      const total = m.hot + m.ice;
      const hotPct = (m.hot / maxTotal) * 100;
      const icePct = (m.ice / maxTotal) * 100;

      const row = document.createElement('div');
      row.className = 'month-row-stat';
      row.innerHTML = `
        <div class="top">
          <span class="mname">${m.month}</span>
          <span class="mtotal">${total} drinks</span>
        </div>
        <div class="bar-track">
          <div class="bar-hot" style="width:${hotPct}%"></div>
          <div class="bar-ice" style="width:${icePct}%"></div>
        </div>
        <div class="counts">
          <span class="count-chip"><span class="count-dot hot"></span>${m.hot} hot</span>
          <span class="count-chip"><span class="count-dot ice"></span>${m.ice} ice</span>
        </div>
      `;
      statsListEl.appendChild(row);
    });
  }

  document.getElementById('statsPrevYear').addEventListener('click', () => {
    statsYear--;
    loadYearStats();
  });

  document.getElementById('statsNextYear').addEventListener('click', () => {
    statsYear++;
    loadYearStats();
  });

  // ---------- Bottom nav switching ----------
  const screens = {
    calendar: document.getElementById('screen-calendar'),
    stats: document.getElementById('screen-stats'),
    profile: document.getElementById('screen-profile'),
  };
  const navItems = document.querySelectorAll('.nav-item');
  const screensWrap = document.querySelector('.screens');

  navItems.forEach(item => {
    item.addEventListener('click', () => {
      navItems.forEach(n => n.classList.remove('active'));
      item.classList.add('active');
      const target = item.dataset.target;
      Object.keys(screens).forEach(key => {
        screens[key].classList.toggle('hidden', key !== target);
      });
      screensWrap.scrollTop = 0;
      if(target === 'stats') loadYearStats();
    });
  });
</script>

</body>
</html>
