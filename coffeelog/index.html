<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#100b09">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Coffeelog">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<title>Coffeelog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #100b09;
    --bg-elevated: #1a1210;
    --bg-cell: #1e1512;
    --bg-cell-today: #2b1c15;
    --text: #f2e8e2;
    --text-secondary: #8c7b72;
    --text-tertiary: #55473f;
    --accent: #D97757;
    --accent-ink: #1c0f08;
    --hot-color: #c08858;
    --ice-color: #6fb3d9;
    --radius-cell: 18px;
    --radius-lg: 22px;
    --nav-height: 82px;
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }

  html, body{
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Plus Jakarta Sans', sans-serif;
    overscroll-behavior:none;
  }

  body{
    display:flex;
    justify-content:center;
    background:
      radial-gradient(circle at 50% 0%, #1c130f 0%, var(--bg) 55%);
  }

  .app{
    width:100%;
    max-width:430px;
    height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }

  .screens{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    padding-bottom: calc(var(--nav-height) + 10px);
  }

  .screen{ min-height:100%; display:flex; flex-direction:column; }

  /* ---------- Header ---------- */
  .header{
    padding:28px 22px 6px;
  }

  .header-top-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .eyebrow{
    font-size:13px;
    font-weight:500;
    color:var(--text-secondary);
    letter-spacing:0.02em;
  }

  .edit-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    padding:7px 13px;
    border-radius:12px;
    border:none;
    background:var(--bg-elevated);
    color:var(--text-secondary);
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    transition:background .18s ease, color .18s ease, transform .15s ease;
  }

  .edit-toggle svg{ width:14px; height:14px; }

  .edit-icon{ display:flex; align-items:center; }

  .edit-toggle:active{ transform:scale(0.95); }

  .edit-toggle.active{
    background:var(--accent);
    color:var(--accent-ink);
  }

  .month-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:10px;
  }

  .month-title{
    font-size:26px;
    font-weight:700;
    letter-spacing:-0.01em;
  }

  .month-nav{
    display:flex;
    gap:8px;
  }

  .year-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:16px;
  }

  .year-label{
    font-size:16px;
    font-weight:700;
    color:var(--text-secondary);
  }

  .stats-empty{
    padding:40px 22px;
    text-align:center;
    color:var(--text-secondary);
    font-size:13.5px;
    line-height:1.5;
  }

  .nav-btn{
    width:38px;
    height:38px;
    border-radius:12px;
    background:var(--bg-elevated);
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-secondary);
    transition:transform .15s ease, color .15s ease, background .15s ease;
  }

  .nav-btn:active{
    transform:scale(0.92);
    color:var(--accent);
    background:#241813;
  }

  .nav-btn svg{ width:18px; height:18px; }

  /* ---------- Legend ---------- */
  .legend{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 22px 20px;
    color:var(--text-secondary);
    font-size:12.5px;
  }

  .legend-items{
    display:flex;
    gap:18px;
  }

  .legend-item{
    display:flex;
    align-items:center;
    gap:7px;
  }

  .legend-item img{ width:16px; height:16px; }

  /* ---------- Calendar ---------- */
  .calendar-wrap{
    padding:0 16px;
    flex:0 0 auto;
    touch-action:pan-y;
  }

  .weekday-row{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    padding:0 4px 10px;
  }

  .weekday-row span{
    text-align:center;
    font-size:12px;
    font-weight:600;
    color:var(--text-tertiary);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:7px;
    transition:opacity .18s ease;
  }

  .grid.locked .cell:not(.empty){ opacity:0.9; }

  .cell{
    position:relative;
    aspect-ratio: 3 / 4;
    background:var(--bg-cell);
    border-radius:var(--radius-cell);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding-top:9px;
    transition:transform .12s ease, background .18s ease;
  }

  .cell.empty{ background:transparent; }

  .cell.today{ background:var(--bg-cell-today); }

  .cell.bounce{
    z-index:5;
    animation: cell-bounce .4s cubic-bezier(.34,1.56,.64,1);
  }

  @keyframes cell-bounce{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.18); }
    65%{ transform:scale(0.94); }
    100%{ transform:scale(1); }
  }

  .particle{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    pointer-events:none;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    animation: particle-burst .55s ease-out forwards;
  }

  @keyframes particle-burst{
    0%{ transform:translate(-50%,-50%) scale(1); opacity:1; }
    100%{ transform:translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity:0; }
  }

  .cell .num{
    font-size:13.5px;
    font-weight:600;
    color:var(--text-secondary);
    line-height:1;
  }

  .cell.today .num{ color:var(--accent); font-weight:700; }

  .cell .today-dot{
    position:absolute;
    top:7px;
    right:9px;
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--accent);
  }

  .cell .icon-wrap{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
  }

  .cell .icon-wrap img{
    width:58%;
    height:auto;
    opacity:0;
    transform:scale(0.6);
    transition:opacity .18s ease, transform .18s cubic-bezier(.34,1.56,.64,1);
  }

  .cell.filled .icon-wrap img{
    opacity:1;
    transform:scale(1);
  }

  /* ---------- Coffee-free streak ---------- */
  .streak-wrap{ padding:16px 16px 6px; }

  .streak-card{
    display:flex;
    align-items:center;
    gap:16px;
    padding:16px 18px;
    background:var(--bg-elevated);
    border-radius:var(--radius-lg);
  }

  .streak-flame{
    position:relative;
    width:56px;
    height:64px;
    flex-shrink:0;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }

  .streak-flame::before{
    content:'';
    position:absolute;
    left:50%;
    bottom:2px;
    width:64px;
    height:64px;
    transform:translateX(-50%);
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,150,70,.45) 0%, rgba(217,119,87,0) 68%);
    opacity:0;
    transition:opacity .4s ease;
  }

  .streak-flame svg{
    position:relative;
    width:100%;
    height:100%;
    transform-origin:50% 92%;
    transition:filter .4s ease;
  }

  .streak-flame .flame-body{ fill:url(#flameGrad); }
  .streak-flame .flame-core{ fill:#ffe6a8; opacity:.92; }

  /* tiers: 0 = out, 1..5 = growing */
  .streak-card[data-tier="0"] .flame-body{ fill:var(--text-tertiary); }
  .streak-card[data-tier="0"] .flame-core{ opacity:0; }
  .streak-card:not([data-tier="0"]) .streak-flame svg{ animation:flame-flicker 1.6s ease-in-out infinite; }
  .streak-card:not([data-tier="0"]) .streak-flame::before{ animation:flame-glow 2.4s ease-in-out infinite; }
  .streak-card[data-tier="1"] .streak-flame::before{ opacity:.35; }
  .streak-card[data-tier="2"] .streak-flame::before{ opacity:.55; }
  .streak-card[data-tier="3"] .streak-flame::before{ opacity:.75; }
  .streak-card[data-tier="4"] .streak-flame::before{ opacity:.9; }
  .streak-card[data-tier="5"] .streak-flame::before{ opacity:1; }
  .streak-card[data-tier="1"] .streak-flame svg{ width:80%; height:80%; }
  .streak-card[data-tier="2"] .streak-flame svg{ width:90%; height:90%; }
  .streak-card[data-tier="5"] .streak-flame svg{ filter:drop-shadow(0 0 8px rgba(255,150,70,.55)); }

  @keyframes flame-flicker{
    0%,100%{ transform:scale(1,1) rotate(0deg); }
    25%{ transform:scale(.97,1.05) rotate(-1.6deg); }
    50%{ transform:scale(1.03,.97) rotate(1deg); }
    75%{ transform:scale(.98,1.04) rotate(1.8deg); }
  }

  @keyframes flame-glow{
    0%,100%{ transform:translateX(-50%) scale(1); }
    50%{ transform:translateX(-50%) scale(1.14); }
  }

  .streak-info{ min-width:0; }

  .streak-count-row{
    display:flex;
    align-items:baseline;
    gap:8px;
  }

  .streak-number{
    font-size:38px;
    font-weight:800;
    letter-spacing:-0.02em;
    line-height:1;
    font-variant-numeric:tabular-nums;
  }

  .streak-unit{
    font-size:14px;
    font-weight:600;
    color:var(--text-secondary);
  }

  .streak-msg{
    margin-top:6px;
    font-size:12px;
    font-weight:500;
    color:var(--text-secondary);
    line-height:1.4;
  }

  @media (prefers-reduced-motion: reduce){
    .streak-card .streak-flame svg,
    .streak-card .streak-flame::before{ animation:none !important; }
  }

  /* ---------- Bottom nav (fixed, PWA style) ---------- */
  .bottom-nav{
    position:fixed;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:100%;
    max-width:430px;
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding:14px 26px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, rgba(16,11,9,0) 0%, var(--bg) 35%);
    z-index:20;
  }

  .nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    background:none;
    border:none;
    color:var(--text-tertiary);
    font-size:11px;
    font-weight:500;
    font-family:inherit;
    padding:8px 18px;
    border-radius:14px;
    transition:color .18s ease, background .18s ease;
  }

  .nav-item svg{ width:22px; height:22px; }

  .nav-item.active{
    color:var(--accent);
    background:var(--bg-elevated);
  }

  .hidden{ display:none !important; }

  /* ---------- Sugar pile screen ---------- */
  .pile-stage{
    position:relative;
    flex:1;
    min-height:260px;
    margin:6px 16px 0;
    border-radius:var(--radius-lg);
    background:var(--bg-elevated);
    overflow:hidden;
    touch-action:none;
  }
  .pile-stage canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .pile-hint{
    position:absolute; left:14px; top:12px;
    font-size:11.5px; font-weight:500; color:var(--text-secondary);
    pointer-events:none; transition:opacity .4s ease;
  }
  .pile-hint.fade{ opacity:0; }
  .pile-tools{ position:absolute; right:10px; top:8px; display:flex; gap:6px; }
  .pile-btn{
    display:flex; align-items:center; gap:6px;
    height:30px; padding:0 12px;
    border:none; border-radius:15px;
    background:rgba(242,232,226,.07);
    color:var(--text-secondary);
    font-family:inherit; font-size:11.5px; font-weight:600;
    transition:transform .15s ease, color .15s ease, background .15s ease;
  }
  .pile-btn svg{ width:14px; height:14px; }
  .pile-btn:active{ transform:scale(.94); color:var(--accent); background:rgba(217,119,87,.14); }
  .pile-empty{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    padding:0 30px; text-align:center; font-size:13.5px; line-height:1.5; color:var(--text-secondary);
    pointer-events:none;
  }

  .sugar-card{
    margin:12px 16px 6px;
    padding:16px 18px 14px;
    background:var(--bg-elevated);
    border-radius:var(--radius-lg);
  }
  .sugar-top{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
  .sugar-label{ font-size:11.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--text-tertiary); }
  .sugar-total{ display:flex; align-items:baseline; gap:4px; margin-top:4px; font-size:34px; font-weight:800; line-height:1; letter-spacing:-.02em; }
  .sugar-total small{ font-size:15px; font-weight:600; color:var(--text-secondary); letter-spacing:0; }
  .sugar-eq{ text-align:right; font-size:12px; color:var(--text-secondary); line-height:1.35; }
  .sugar-eq b{ display:block; font-size:18px; font-weight:700; color:var(--text); }
  .sugar-bar{ height:6px; margin-top:14px; border-radius:3px; background:var(--bg-cell); overflow:hidden; }
  .sugar-bar i{ display:block; height:100%; width:0; border-radius:3px; background:var(--accent); transition:width .6s var(--ease-out, ease), background .3s ease; }
  .sugar-bar i.over{ background:#e5604d; }
  .sugar-meta{ display:flex; justify-content:space-between; margin-top:8px; font-size:12px; font-weight:600; color:var(--text-secondary); }
  .sugar-meta span:last-child{ color:var(--text-tertiary); font-weight:500; }
  .sugar-note{ margin-top:10px; font-size:11.5px; line-height:1.45; color:var(--text-tertiary); }

  /* ---------- Stats screen ---------- */
  .stats-summary{
    padding:8px 22px 20px;
  }

  .summary-card{
    background:var(--bg-elevated);
    border-radius:var(--radius-lg);
    padding:18px 16px;
    display:flex;
    align-items:center;
    gap:14px;
  }

  .summary-left{
    display:flex;
    align-items:center;
    gap:12px;
    flex:1;
    min-width:0;
  }

  .summary-icon-circle{
    width:44px;
    height:44px;
    flex-shrink:0;
    border-radius:50%;
    background:rgba(217,119,87,0.14);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .summary-icon-circle svg{ width:22px; height:22px; color:var(--accent); }

  .summary-count{ min-width:0; }

  .summary-number{
    font-size:26px;
    font-weight:800;
    letter-spacing:-0.01em;
    line-height:1;
  }

  .summary-label{
    margin-top:4px;
    font-size:11.5px;
    color:var(--text-secondary);
    font-weight:500;
  }

  .summary-divider{
    width:1px;
    align-self:stretch;
    background:rgba(242,232,226,0.08);
    flex-shrink:0;
  }

  .summary-right{
    display:flex;
    gap:18px;
    flex-shrink:0;
  }

  .summary-stat{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }

  .summary-stat-top{
    display:flex;
    align-items:center;
    gap:5px;
  }

  .summary-stat-top svg{ width:15px; height:15px; }
  .summary-stat.hot svg{ color:var(--hot-color); }
  .summary-stat.cold svg{ color:var(--ice-color); }

  .summary-stat-num{
    font-size:16px;
    font-weight:700;
  }

  .summary-stat-label{
    font-size:10.5px;
    color:var(--text-secondary);
    font-weight:500;
  }

  .section-title{
    font-size:13px;
    font-weight:600;
    color:var(--text-secondary);
  }

  .chart-section{
    padding:6px 22px 22px;
  }

  .chart-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }

  .chart-legend{
    display:flex;
    gap:14px;
    font-size:11.5px;
    color:var(--text-secondary);
  }

  .legend-dot{
    display:inline-flex;
    align-items:center;
    gap:5px;
  }

  .legend-dot::after{
    content:"";
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--dot-color);
  }

  .legend-dot.hot{ --dot-color: var(--hot-color); }
  .legend-dot.cold{ --dot-color: var(--ice-color); }

  .chart-wrap{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:4px;
    height:130px;
  }

  .month-track{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
    height:100%;
    background:none;
    border:none;
    padding:0;
    position:relative;
    font-family:inherit;
  }

  .track-bg{
    position:relative;
    width:9px;
    height:96px;
    border-radius:5px;
    background:var(--bg-elevated);
    display:flex;
    align-items:flex-end;
    overflow:visible;
    transition:width .18s ease, background .18s ease;
  }

  .month-track.selected .track-bg{
    width:11px;
    background:#241813;
  }

  .track-fill{
    width:100%;
    display:flex;
    flex-direction:column-reverse;
    border-radius:5px;
    overflow:hidden;
  }

  .fill-hot{ background:var(--hot-color); width:100%; }
  .fill-cold{ background:var(--ice-color); width:100%; }

  .track-dot{
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--text-tertiary);
    transition:background .18s ease, transform .18s ease;
  }

  .month-track.selected .track-dot{
    background:var(--accent);
    transform:scale(1.3);
  }

  .track-label{
    font-size:10px;
    font-weight:600;
    color:var(--text-tertiary);
    transition:color .18s ease;
  }

  .month-track.selected .track-label{ color:var(--text); }

  .track-tooltip{
    position:absolute;
    bottom:calc(100% + 10px);
    left:50%;
    transform:translateX(-50%);
    background:var(--bg-cell-today);
    border-radius:12px;
    padding:6px 10px;
    text-align:center;
    white-space:nowrap;
    box-shadow:0 6px 16px rgba(0,0,0,0.35);
    pointer-events:none;
    z-index:6;
  }

  .track-tooltip .t-month{
    display:block;
    font-size:10px;
    color:var(--text-secondary);
    font-weight:600;
  }

  .track-tooltip .t-value{
    display:block;
    font-size:14px;
    font-weight:800;
    color:var(--text);
    line-height:1.2;
  }

  .details-section{
    padding:0 22px 18px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .detail-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--bg-elevated);
    border-radius:18px;
    padding:16px;
    border:none;
    width:100%;
    text-align:left;
    font-family:inherit;
    color:inherit;
    transition:transform .12s ease;
  }

  .detail-card:active{ transform:scale(0.98); }

  .detail-left{ min-width:0; }

  .detail-month{
    font-size:15px;
    font-weight:700;
  }

  .detail-total{
    margin-top:5px;
    font-size:12.5px;
    color:var(--text-secondary);
  }

  .detail-breakdown{
    margin-top:2px;
    font-size:11.5px;
    color:var(--text-tertiary);
  }

  .detail-right{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }

  .detail-icons{
    display:flex;
  }

  .detail-icons img{
    width:20px;
    height:20px;
    margin-left:-6px;
    border-radius:50%;
    background:var(--bg);
    padding:2px;
  }

  .detail-icons img:first-child{ margin-left:0; }

  .detail-chevron{ width:16px; height:16px; color:var(--text-tertiary); flex-shrink:0; }

  .insight-card{
    display:flex;
    align-items:center;
    gap:12px;
    margin:0 22px 26px;
    padding:15px 16px;
    background:var(--bg-elevated);
    border-radius:16px;
  }

  .insight-icon{

<style id="ui-v2">
/* ===== UI v2 — rounder, floating iOS tab bar, springy screen transitions (visual only) ===== */
:root{--spring:cubic-bezier(.34,1.56,.64,1);--ease-out:cubic-bezier(.22,1,.36,1);--radius-cell:22px;--radius-lg:30px;--nav-height:96px;}
body{background:radial-gradient(120% 45% at 80% -6%,rgba(217,119,87,.16),transparent 62%),radial-gradient(100% 40% at 0% 100%,rgba(217,119,87,.06),transparent 60%),var(--bg);background-attachment:fixed;}
.header{padding-top:34px;}
.month-title{font-size:30px;letter-spacing:-.8px;font-weight:800;}
.eyebrow{font-size:13px;}

/* round everything */
.edit-toggle{border-radius:30px;padding:9px 16px;transition:background .25s,color .25s,transform .45s var(--spring);}
.edit-toggle:active{transform:scale(.9);}
.nav-btn{width:42px;height:42px;border-radius:50%;transition:transform .45s var(--spring),color .2s,background .2s;}
.nav-btn:active{transform:scale(.82);}
.cell{border-radius:var(--radius-cell);transition:transform .35s var(--spring),background .25s;}
.cell:not(.empty):active{transform:scale(.92);}
.summary-card{border-radius:var(--radius-lg);padding:20px 18px;}
.detail-card{border-radius:26px;transition:transform .45s var(--spring);}
.detail-card:active{transform:scale(.96);}
.insight-card{border-radius:26px;}
.track-bg{width:11px;border-radius:6px;}.track-fill{border-radius:6px;}
.month-track.selected .track-bg{width:13px;}
.track-tooltip{border-radius:16px;}
.logout-btn,.google-btn{border-radius:30px;transition:transform .45s var(--spring),background .2s;}
.logout-btn:active,.google-btn:active{transform:scale(.94);}
.avatar{box-shadow:0 18px 40px -16px rgba(217,119,87,.5);}
.toast{border-radius:30px;bottom:calc(var(--nav-height) + 10px);}

/* screen "open" effect: each tab settles in with a soft spring, content staggers in */
.screen{animation:screen-in .55s var(--ease-out) both;}
@keyframes screen-in{from{opacity:0;transform:translateY(18px) scale(.975);}to{opacity:1;transform:none;}}
.screen > *{animation:rise .6s var(--ease-out) both;}
.screen > *:nth-child(1){animation-delay:.02s}.screen > *:nth-child(2){animation-delay:.07s}
.screen > *:nth-child(3){animation-delay:.12s}.screen > *:nth-child(4){animation-delay:.17s}
.screen > *:nth-child(5){animation-delay:.22s}.screen > *:nth-child(6){animation-delay:.27s}
@keyframes rise{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:none;}}
.summary-icon-circle{animation:pop .7s var(--spring) .2s both;}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* floating iOS tab bar — bounce happens from the centre of each item */
.bottom-nav{left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:calc(100% - 44px);max-width:386px;padding:8px;gap:4px;justify-content:space-between;border-radius:36px;background:rgba(36,24,19,.68);-webkit-backdrop-filter:blur(24px) saturate(1.7);backdrop-filter:blur(24px) saturate(1.7);border:1px solid rgba(242,232,226,.09);box-shadow:0 20px 46px -12px rgba(0,0,0,.7),inset 0 1px 0 rgba(242,232,226,.07);}
.nav-item{position:relative;flex:1;padding:9px 0 8px;gap:4px;border-radius:28px;background:transparent;transform-origin:50% 50%;transition:color .3s,background .35s,transform .5s var(--spring);}
.nav-item svg{width:23px;height:23px;transform-origin:50% 50%;}
.nav-item:active{transform:scale(.88);}
.nav-item.active{color:var(--accent);background:rgba(217,119,87,.17);animation:tab-pop .62s var(--spring);}
.nav-item.active svg{animation:icon-pop .62s var(--spring);}
@keyframes tab-pop{0%{transform:scale(.84)}50%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes icon-pop{0%{transform:scale(.7)}55%{transform:scale(1.22)}100%{transform:scale(1)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important;}}

</style>
</head>

  // ---------- Auth (shared/auth.js: Google login + whitelist) ----------
  const sb = Auth.client;

  let currentUser = null;

  const appShellEl = document.getElementById('appShell');
  const logoutBtn = document.getElementById('logoutBtn');

  logoutBtn.addEventListener('click', () => Auth.signOut());

  function showApp(user){
    currentUser = user;
    appShellEl.classList.remove('hidden');

    const meta = user.user_metadata || {};
    const name = meta.full_name || meta.name || user.email || 'Coffeelog user';
    document.getElementById('profileName').textContent = name;
    document.getElementById('profileEmail').textContent = user.email || '';

    const avatarEl = document.getElementById('profileAvatar');
    if(meta.avatar_url){
      avatarEl.innerHTML = `<img src="${esc(meta.avatar_url)}" alt="${esc(name)}">`;
    } else {
      avatarEl.textContent = name.charAt(0).toUpperCase();
    }

    loadMonthEntries();
    loadYearStats();
    loadStreak();
  }

  function showLogin(){
    currentUser = null;
    setEditMode(false);
    Object.keys(coffeeLog).forEach(key => delete coffeeLog[key]);
    Object.keys(monthCache).forEach(key => delete monthCache[key]);
    switchScreen('calendar');
    appShellEl.classList.add('hidden');
  }

  Auth.init({
    name: 'Coffeelog',
    tagline: 'Track your daily drinks',
    accent: '#D97757',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><path d="M6 2v2M10 2v2M14 2v2"/></svg>',
    strings: {
      signInTitle: 'Sign in to ',
      loading: 'Loading…',
      checking: 'Checking access…',
      google: 'Sign in with Google',
      retry: 'Try again',
      logout: 'Sign out',
      foot: 'Private access · registered accounts only',
      denied: 'This account is not allowed. Use a registered email.',
      loginFailed: 'Sign-in failed: ',
      checkFailed: 'Could not check access. Check your connection and try again.'
    },
    onSignIn: showApp,
    onSignOut: showLogin
  });

  // ---------- Calendar state ----------
  const STATE_ORDER = [null, 'hot', 'ice'];
  let today = new Date();
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth(); // 0-indexed
  let editMode = false;

  // in-memory cache of the currently viewed month's entries: { "YYYY-M-D": "hot" | "ice" }
  const coffeeLog = {};

  const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  const gridEl = document.getElementById('grid');
  const monthTitleEl = document.getElementById('monthTitle');
  const editToggleBtn = document.getElementById('editToggle');
  const editIconEl = document.getElementById('editIcon');
  const editLabelEl = document.getElementById('editLabel');
  const calendarWrapEl = document.getElementById('calendarWrap');

  const EDIT_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>';
  const SAVE_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

  let _toastT = null;
  function showToast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(_toastT);
    _toastT = setTimeout(() => el.classList.remove('show'), 2600);
  }

  function keyFor(y,m,d){ return `${y}-${m}-${d}`; }

  function burstParticles(cell){
    const colors = ['var(--accent)', 'var(--hot-color)', 'var(--ice-color)', '#ffffff'];
    const count = 10;
    for(let i=0; i<count; i++){
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
      const dist = 24 + Math.random() * 16;
      p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
      p.style.background = colors[i % colors.length];
      cell.appendChild(p);
      p.addEventListener('animationend', () => p.remove());
    }
  }

  function isoDate(y, m, d){
    return `${y}-${String(m + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  // Writes are chained per date so rapid taps on one cell reach the server in order.
  const pendingWrites = {};

  function saveEntry(dateStr, next, y, m){
    const write = () => next
      ? sb.from('coffeelog_entries').upsert(
          { user_id: currentUser.id, entry_date: dateStr, drink_type: next },
          { onConflict: 'user_id,entry_date' }
        )
      : sb.from('coffeelog_entries')
          .delete()
          .eq('user_id', currentUser.id)
          .eq('entry_date', dateStr);

    const prev = pendingWrites[dateStr] || Promise.resolve({ error: null });
    const p = prev.then(async prevRes => {
      let res;
      try { res = await write(); } catch(e){ res = { error: e }; }
      return { error: (res && res.error) || prevRes.error };
    });
    pendingWrites[dateStr] = p;

    p.then(res => {
      if(pendingWrites[dateStr] !== p) return;   // a newer tap is still in flight
      delete pendingWrites[dateStr];
      if(res.error){
        showToast("Couldn't save, try again");
        // resync from the server instead of guessing the previous state
        if(viewYear === y && viewMonth === m) loadMonthEntries();
      }
      loadStreak();
    });
  }

  // ---------- Coffee-free streak ----------
  // Days since the latest logged drink (today or earlier). 0 when today is logged.
  const streakCardEl = document.getElementById('streakCard');
  const streakNumberEl = document.getElementById('streakNumber');
  const streakUnitEl = document.getElementById('streakUnit');
  const streakMsgEl = document.getElementById('streakMsg');
  let streakLoadSeq = 0;
  let streakShown = null;
  let streakAnimT = null;

  function streakTier(n){
    if(n <= 0) return 0;
    if(n < 3) return 1;
    if(n < 7) return 2;
    if(n < 14) return 3;
    if(n < 30) return 4;
    return 5;
  }

  function streakMessage(n){
    if(n <= 0) return "Had a drink today. Tomorrow's a fresh start.";
    if(n < 3) return 'Good start, keep it going.';
    if(n < 7) return 'Building momentum.';
    if(n < 14) return 'A full week and counting.';
    if(n < 30) return 'Two weeks strong.';
    return 'A month or more. Habit locked in.';
  }

  function setStreakNumber(n){
    clearTimeout(streakAnimT);
    const from = streakShown == null ? 0 : streakShown;
    streakShown = n;
    if(from === n){ streakNumberEl.textContent = n; return; }
    const steps = Math.min(Math.abs(n - from), 20);
    let i = 0;
    const tick = () => {
      i++;
      streakNumberEl.textContent = Math.round(from + (n - from) * (i / steps));
      if(i < steps) streakAnimT = setTimeout(tick, 28);
    };
    tick();
  }

  function renderStreak(lastDateStr){
    if(!lastDateStr){
      streakShown = null;
      streakCardEl.dataset.tier = '0';
      streakNumberEl.textContent = '–';
      streakUnitEl.textContent = 'days without coffee';
      streakMsgEl.textContent = 'Log a drink to start tracking.';
      return;
    }
    const now = new Date();
    const [ly, lm, ld] = lastDateStr.split('-').map(Number);
    const days = Math.max(0, Math.round((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - Date.UTC(ly, lm - 1, ld)) / 86400000));
    streakCardEl.dataset.tier = String(streakTier(days));
    setStreakNumber(days);
    streakUnitEl.textContent = days === 1 ? 'day without coffee' : 'days without coffee';
    streakMsgEl.textContent = streakMessage(days);
  }

  async function loadStreak(){
    if(!currentUser) return;
    const seq = ++streakLoadSeq;
    const now = new Date();
    const todayStr = isoDate(now.getFullYear(), now.getMonth(), now.getDate());
    const { data, error } = await sb.from('coffeelog_entries')
      .select('entry_date')
      .eq('user_id', currentUser.id)
      .lte('entry_date', todayStr)
      .order('entry_date', { ascending: false })
      .limit(1);
    if(seq !== streakLoadSeq || error) return;
    renderStreak(data && data.length ? data[0].entry_date : null);
  }

  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible') loadStreak();
  });

  function markAndAnimate(k, d){
    const current = coffeeLog[k] || null;
    const idx = STATE_ORDER.indexOf(current);
    const next = STATE_ORDER[(idx + 1) % STATE_ORDER.length];
    if(next) coffeeLog[k] = next; else delete coffeeLog[k];
    monthCache[ymKey(viewYear, viewMonth)] = Object.assign({}, coffeeLog);
    render();
    const newCell = gridEl.querySelector(`[data-day="${d}"]`);
    if(newCell){
      newCell.classList.add('bounce');
      burstParticles(newCell);
      setTimeout(() => newCell.classList.remove('bounce'), 400);
    }

    if(!currentUser) return;
    saveEntry(isoDate(viewYear, viewMonth, d), next, viewYear, viewMonth);
  }

  let monthLoadSeq = 0;

  async function loadMonthEntries(){
    if(!currentUser) return;
    const seq = ++monthLoadSeq;
    const start = isoDate(viewYear, viewMonth, 1);
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const end = isoDate(viewYear, viewMonth, daysInMonth);

    const { data, error } = await sb.from('coffeelog_entries')
      .select('entry_date, drink_type')
      .eq('user_id', currentUser.id)
      .gte('entry_date', start)
      .lte('entry_date', end);

    if(seq !== monthLoadSeq) return;   // a newer month was requested meanwhile
    if(error){ showToast("Couldn't load data"); return; }
    Object.keys(coffeeLog).forEach(key => delete coffeeLog[key]);
    if(data){
      data.forEach(row => {
        const [y, m, d] = row.entry_date.split('-').map(Number);
        coffeeLog[keyFor(y, m - 1, d)] = row.drink_type;
      });
    }
    monthCache[ymKey(viewYear, viewMonth)] = Object.assign({}, coffeeLog);
    render();
  }

  function render(){
    monthTitleEl.textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;
    gridEl.innerHTML = '';

    const firstDay = new Date(viewYear, viewMonth, 1).getDay(); // 0 = Sunday
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

    for(let i=0; i<firstDay; i++){
      const empty = document.createElement('div');
      empty.className = 'cell empty';
      empty.setAttribute('aria-hidden', 'true');
      gridEl.appendChild(empty);
    }

    for(let d=1; d<=daysInMonth; d++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.day = d;

      const isToday = viewYear === today.getFullYear() && viewMonth === today.getMonth() && d === today.getDate();
      if(isToday) cell.classList.add('today');

      const k = keyFor(viewYear, viewMonth, d);
      const state = coffeeLog[k];
      if(state) cell.classList.add('filled');

      const num = document.createElement('div');
      num.className = 'num';
      num.textContent = d;
      cell.appendChild(num);

      if(isToday){
        const dot = document.createElement('div');
        dot.className = 'today-dot';
        cell.appendChild(dot);
      }

      const iconWrap = document.createElement('div');
      iconWrap.className = 'icon-wrap';
      if(state === 'hot'){
        iconWrap.innerHTML = `<img src="${ICON_HOT}" alt="Hot drink">`;
      } else if(state === 'ice'){
        iconWrap.innerHTML = `<img src="${ICON_ICE}" alt="Cold drink">`;
      }
      cell.appendChild(iconWrap);

      const stateLabel = state === 'hot' ? 'hot drink' : state === 'ice' ? 'cold drink' : 'no drink';
      cell.setAttribute('role', 'button');
      cell.tabIndex = 0;
      cell.setAttribute('aria-label', `${d} ${MONTH_NAMES[viewMonth]}, ${stateLabel}`);
      cell.setAttribute('aria-disabled', String(!editMode));

      const activate = () => {
        if(!editMode) return;
        markAndAnimate(k, d);
      };
      cell.addEventListener('click', activate);
      cell.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); activate(); }
      });

      gridEl.appendChild(cell);
    }
  }

  // Entries of months already visited, so a month change can render instantly.
  const monthCache = {};
  const ymKey = (y, m) => `${y}-${m}`;

  function showCachedMonth(){
    Object.keys(coffeeLog).forEach(key => delete coffeeLog[key]);
    Object.assign(coffeeLog, monthCache[ymKey(viewYear, viewMonth)] || {});
  }

  // step: -1 = previous month, +1 = next month. Slides the grid in from that side.
  function changeMonth(step){
    viewMonth += step;
    if(viewMonth < 0){ viewMonth = 11; viewYear--; }
    if(viewMonth > 11){ viewMonth = 0; viewYear++; }
    showCachedMonth();
    render();

    gridEl.style.transition = 'none';
    gridEl.style.transform = `translateX(${step > 0 ? 56 : -56}px)`;
    gridEl.style.opacity = '0';
    void gridEl.offsetWidth;                       // commit the start frame
    gridEl.style.transition = 'transform .5s var(--spring), opacity .28s ease';
    gridEl.style.transform = '';
    gridEl.style.opacity = '';

    loadMonthEntries();
  }

  function goToPrevMonth(){ changeMonth(-1); }
  function goToNextMonth(){ changeMonth(1); }

  document.getElementById('prevBtn').addEventListener('click', goToPrevMonth);
  document.getElementById('nextBtn').addEventListener('click', goToNextMonth);

  // ---------- Edit mode toggle ----------
  function setEditMode(on){
    editMode = on;
    editToggleBtn.classList.toggle('active', editMode);
    editIconEl.innerHTML = editMode ? SAVE_ICON_SVG : EDIT_ICON_SVG;
    editLabelEl.textContent = editMode ? 'Done' : 'Edit';
    gridEl.classList.toggle('locked', !editMode);
    gridEl.querySelectorAll('.cell:not(.empty)').forEach(c => c.setAttribute('aria-disabled', String(!editMode)));
  }

  editToggleBtn.addEventListener('click', () => setEditMode(!editMode));

  // ---------- Swipe to change month (only when edit mode is off) ----------
  let touchStartX = 0, touchStartY = 0, swipeAxis = null, swipeDx = 0, swipeT = 0;

  function springBack(){
    gridEl.style.transition = 'transform .45s var(--spring), opacity .25s ease';
    gridEl.style.transform = '';
    gridEl.style.opacity = '';
  }

  calendarWrapEl.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    swipeAxis = null;
    swipeDx = 0;
    swipeT = Date.now();
  }, { passive: true });

  calendarWrapEl.addEventListener('touchmove', (e) => {
    if(editMode) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    if(!swipeAxis){
      if(Math.max(Math.abs(dx), Math.abs(dy)) < 8) return;
      swipeAxis = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'x' : 'y';
    }
    if(swipeAxis !== 'x') return;
    swipeDx = dx;
    gridEl.style.transition = 'none';
    gridEl.style.transform = `translateX(${dx * 0.55}px)`;
    gridEl.style.opacity = String(1 - Math.min(Math.abs(dx) / 380, 0.45));
  }, { passive: true });

  function endSwipe(){
    if(editMode || swipeAxis !== 'x'){ swipeAxis = null; return; }
    swipeAxis = null;
    const dx = swipeDx;
    const fast = Math.abs(dx) / Math.max(Date.now() - swipeT, 1) > 0.5;   // px per ms
    if(Math.abs(dx) > 70 || (fast && Math.abs(dx) > 28)){
      // finger right = previous month: current month leaves to the right
      const step = dx > 0 ? -1 : 1;
      gridEl.style.transition = 'transform .16s ease-in, opacity .16s ease-in';
      gridEl.style.transform = `translateX(${dx > 0 ? 90 : -90}px)`;
      gridEl.style.opacity = '0';
      setTimeout(() => changeMonth(step), 150);
    } else {
      springBack();
    }
  }

  calendarWrapEl.addEventListener('touchend', endSwipe, { passive: true });
  calendarWrapEl.addEventListener('touchcancel', () => { if(swipeAxis === 'x') springBack(); swipeAxis = null; }, { passive: true });

  // ---------- Yearly stats (queried from coffeelog_entries, grouped client-side) ----------
  let statsYear = today.getFullYear();
  let selectedMonthIdx = today.getMonth();

  const statsYearLabelEl = document.getElementById('statsYearLabel');
  const monthChartEl = document.getElementById('monthChart');
  const detailMonthEl = document.getElementById('detailMonth');
  const detailTotalEl = document.getElementById('detailTotal');
  const detailBreakdownEl = document.getElementById('detailBreakdown');
  const detailIconsEl = document.getElementById('detailIcons');
  const insightHeadlineEl = document.getElementById('insightHeadline');
  const insightSubEl = document.getElementById('insightSub');

  const MONTH_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  let yearLoadSeq = 0;

  async function loadYearStats(){
    if(!currentUser) return;
    const seq = ++yearLoadSeq;
    statsYearLabelEl.textContent = statsYear;

    const start = `${statsYear}-01-01`;
    const end = `${statsYear}-12-31`;

    const { data, error } = await sb.from('coffeelog_entries')
      .select('entry_date, drink_type')
      .eq('user_id', currentUser.id)
      .gte('entry_date', start)
      .lte('entry_date', end);

    if(seq !== yearLoadSeq) return;   // a newer year was requested meanwhile

    const monthly = MONTH_NAMES.map(name => ({ month: name, hot: 0, ice: 0 }));
    if(!error && data){
      data.forEach(row => {
        const monthIdx = Number(row.entry_date.split('-')[1]) - 1;
        if(row.drink_type === 'hot') monthly[monthIdx].hot++;
        else if(row.drink_type === 'ice') monthly[monthIdx].ice++;
      });
    }

    // pick a sensible default selected month: today's month if viewing the
    // current year, otherwise the last month in that year with any activity
    if(statsYear === today.getFullYear()){
      selectedMonthIdx = today.getMonth();
    } else {
      let lastActive = -1;
      monthly.forEach((m, i) => { if(m.hot + m.ice > 0) lastActive = i; });
      selectedMonthIdx = lastActive >= 0 ? lastActive : 11;
    }

    renderStats(monthly);
  }

  function renderStats(monthly){
    const totalHot = monthly.reduce((s,m) => s + m.hot, 0);
    const totalIce = monthly.reduce((s,m) => s + m.ice, 0);
    document.getElementById('totalHot').textContent = totalHot;
    document.getElementById('totalIce').textContent = totalIce;
    document.getElementById('totalAll').textContent = totalHot + totalIce;

    renderChart(monthly);
    renderDetail(monthly[selectedMonthIdx], selectedMonthIdx);
    renderInsight(totalHot + totalIce);
  }

  function renderChart(monthly){
    const maxTotal = Math.max(1, ...monthly.map(m => m.hot + m.ice));
    const maxPx = 96;

    monthChartEl.innerHTML = '';

    monthly.forEach((m, i) => {
      const total = m.hot + m.ice;
      const hotPx = (m.hot / maxTotal) * maxPx;
      const icePx = (m.ice / maxTotal) * maxPx;
      const fillPx = hotPx + icePx;
      const isSelected = i === selectedMonthIdx;

      const track = document.createElement('button');
      track.type = 'button';
      track.className = 'month-track' + (isSelected ? ' selected' : '');
      track.setAttribute('aria-label', `${MONTH_NAMES[i]}: ${total} drinks`);

      track.innerHTML = `
        <div class="track-bg">
          <div class="track-fill" style="height:${fillPx}px">
            <div class="fill-cold" style="height:${icePx}px"></div>
            <div class="fill-hot" style="height:${hotPx}px"></div>
          </div>
          ${isSelected ? `<div class="track-tooltip"><span class="t-month">${MONTH_SHORT[i]}</span><span class="t-value">${total}</span></div>` : ''}
        </div>
        <span class="track-dot"></span>
        <span class="track-label">${MONTH_SHORT[i]}</span>
      `;

      track.addEventListener('click', () => {
        if(selectedMonthIdx === i) return;
        selectedMonthIdx = i;
        renderChart(monthly);
        renderDetail(monthly[selectedMonthIdx], selectedMonthIdx);
      });

      monthChartEl.appendChild(track);
    });
  }

  function renderDetail(m, idx){
    const total = m.hot + m.ice;
    detailMonthEl.textContent = MONTH_NAMES[idx];

    if(total === 0){
      detailTotalEl.textContent = 'No drinks yet';
      detailBreakdownEl.textContent = 'Tap a day on the calendar to log one';
      detailIconsEl.innerHTML = '';
      return;
    }

    detailTotalEl.textContent = `${total} drink${total === 1 ? '' : 's'}`;
    detailBreakdownEl.textContent = `${m.hot} hot · ${m.ice} cold`;

    const icons = [];
    for(let i = 0; i < m.hot && icons.length < 4; i++) icons.push(ICON_HOT);
    for(let i = 0; i < m.ice && icons.length < 4; i++) icons.push(ICON_ICE);
    detailIconsEl.innerHTML = icons.map(src => `<img src="${src}" alt="">`).join('');
  }

  function renderInsight(totalAll){
    let headline;
    if(totalAll === 0) headline = 'Ready when you are.';
    else if(totalAll < 5) headline = 'Small steps, good sips.';
    else if(totalAll < 15) headline = 'Building a nice little habit.';
    else headline = 'Certified coffee enthusiast.';

    insightHeadlineEl.textContent = headline;
    insightSubEl.textContent = totalAll === 0
      ? `No drinks logged in ${statsYear} yet.`
      : `You logged ${totalAll} drink${totalAll === 1 ? '' : 's'} in ${statsYear}.`;
  }

  document.getElementById('statsPrevYear').addEventListener('click', () => {
    statsYear--;
    loadYearStats();
  });

  document.getElementById('statsNextYear').addEventListener('click', () => {
    statsYear++;
    loadYearStats();
  });

  // ---------- Keep "today" fresh if the app stays open past midnight ----------
  document.addEventListener('visibilitychange', () => {
    if(document.hidden) return;
    const now = new Date();
    if(now.toDateString() === today.toDateString()) return;
    today = now;
    render();
  });

  // ---------- Sugar pile (physics gimmick) ----------
  // Rough estimates for a "kopi gula aren kekinian". Tweak these two numbers if you like.
  const SUGAR_HOT_G = 20;          // g sugar in one hot cup
  const SUGAR_ICE_G = 28;          // g sugar in one iced cup (bigger cup, more milk + syrup)
  const SUGAR_DAILY_LIMIT_G = 50;  // Kemenkes guideline: max ~50 g (4 tbsp) sugar per day
  const SUGAR_TSP_G = 4;           // 1 teaspoon ~ 4 g

  const pileStageEl = document.getElementById('pileStage');
  const pileCanvasEl = document.getElementById('pileCanvas');
  const pileCtx = pileCanvasEl.getContext('2d');
  const pileEmptyEl = document.getElementById('pileEmpty');
  const pileHintEl = document.getElementById('pileHint');
  const pileMotionBtn = document.getElementById('pileMotionBtn');

  const pileImgs = { hot: new Image(), ice: new Image() };
  pileImgs.hot.src = ICON_HOT;
  pileImgs.ice.src = ICON_ICE;

  let pileYear = today.getFullYear();
  let pileMonth = today.getMonth();
  let pileSeq = 0;
  let pileSig = null;
  let pileActive = false;
  let pileRAF = 0, pileLast = 0, pileAcc = 0, pileSpawnT = 0;
  let pileEngine = null, pileMouse = null, pileWalls = [];
  let pileBodies = [], pileQueue = [];
  let pileW = 0, pileH = 0, pileDpr = 1, pileCupH = 64;
  let pileTilt = { x: 0, y: 1 }, pileHasSensor = false, pileLastShake = 0;
  const PILE_STEP = 1000 / 60;

  function pileEnsureEngine(){
    if(pileEngine || !window.Matter) return !!pileEngine;
    const { Engine, Mouse, MouseConstraint, Composite } = Matter;
    pileEngine = Engine.create({ gravity: { x: 0, y: 1, scale: 0.0011 }, positionIterations: 8, velocityIterations: 6 });
    pileMouse = Mouse.create(pileCanvasEl);
    pileMouse.element.removeEventListener('mousewheel', pileMouse.mousewheel);
    pileMouse.element.removeEventListener('DOMMouseScroll', pileMouse.mousewheel);
    const mc = MouseConstraint.create(pileEngine, { mouse: pileMouse, constraint: { stiffness: 0.25, damping: 0.1, render: { visible: false } } });
    Composite.add(pileEngine.world, mc);
    const release = () => { pileMouse.button = -1; };
    window.addEventListener('mouseup', release);
    window.addEventListener('touchend', release);
    return true;
  }

  function pileMeasure(){
    const r = pileStageEl.getBoundingClientRect();
    if(!r.width || !r.height) return false;
    pileW = r.width; pileH = r.height;
    pileDpr = Math.min(window.devicePixelRatio || 1, 3);
    pileCanvasEl.width = Math.round(pileW * pileDpr);
    pileCanvasEl.height = Math.round(pileH * pileDpr);
    if(pileMouse) pileMouse.pixelRatio = pileDpr;
    if(pileEngine){
      const { Bodies, Composite } = Matter;
      pileWalls.forEach(w => Composite.remove(pileEngine.world, w));
      const t = 300, opt = { isStatic: true, friction: 0.4, restitution: 0.2 };
      pileWalls = [
        Bodies.rectangle(pileW / 2, pileH + t / 2, pileW + t * 2, t, opt),   // floor
        Bodies.rectangle(-t / 2, pileH / 2, t, pileH * 4, opt),              // left
        Bodies.rectangle(pileW + t / 2, pileH / 2, t, pileH * 4, opt),       // right
        Bodies.rectangle(pileW / 2, -pileH * 1.6 - t / 2, pileW + t * 2, t, opt)  // ceiling (high up)
      ];
      Composite.add(pileEngine.world, pileWalls);
      // keep cups that were outside after a resize
      pileBodies.forEach(b => {
        const x = Math.min(Math.max(b.position.x, pileCupH * .3), pileW - pileCupH * .3);
        const y = Math.min(b.position.y, pileH - pileCupH * .5);
        if(x !== b.position.x || y !== b.position.y) Matter.Body.setPosition(b, { x, y });
      });
    }
    return true;
  }

  function pileClear(){
    if(pileEngine) pileBodies.forEach(b => Matter.Composite.remove(pileEngine.world, b));
    pileBodies = []; pileQueue = [];
  }

  function pileSpawn(types){
    pileClear();
    if(!pileEnsureEngine() || !pileW) return;
    const n = types.length;
    pileCupH = Math.max(44, Math.min(92, Math.sqrt((pileW * pileH) / (Math.max(n, 1) * 0.54 * 1.9))));
    pileQueue = types.slice();
    pileSpawnT = 0;
  }

  function pileAddCup(type){
    const { Bodies, Body, Composite } = Matter;
    const h = pileCupH, w = h * 0.54;
    const x = h * 0.5 + Math.random() * Math.max(1, pileW - h);
    const b = Bodies.rectangle(x, -h, w, h, {
      chamfer: { radius: w * 0.26 },
      restitution: 0.35, friction: 0.35, frictionAir: 0.012, density: 0.0015
    });
    b.cupType = type;
    Body.setAngle(b, (Math.random() - .5) * 1.2);
    Body.setVelocity(b, { x: (Math.random() - .5) * 3, y: 2 });
    Body.setAngularVelocity(b, (Math.random() - .5) * 0.15);
    Composite.add(pileEngine.world, b);
    pileBodies.push(b);
  }

  function pileKick(power){
    if(!pileEngine) return;
    pileHintEl.classList.add('fade');
    pileBodies.forEach(b => {
      Matter.Body.setVelocity(b, {
        x: b.velocity.x + (Math.random() - .5) * 20 * power,
        y: b.velocity.y - (5 + Math.random() * 11) * power
      });
      Matter.Body.setAngularVelocity(b, b.angularVelocity + (Math.random() - .5) * 0.5 * power);
    });
  }

  // ----- sensors -----
  function pileOnOrient(e){
    if(e.beta == null || e.gamma == null) return;
    const b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
    pileTilt.x = Math.sin(g) * Math.cos(b);   // gravity in screen coordinates (x right, y down)
    pileTilt.y = Math.sin(b);
    if(Math.hypot(pileTilt.x, pileTilt.y) < 0.2){ pileTilt.x = 0; pileTilt.y = 0.2; }   // lying flat: let cups settle
    if(!pileHasSensor){
      pileHasSensor = true;
      pileMotionBtn.classList.add('hidden');
      pileHintEl.textContent = 'Tilt or shake your phone';
    }
  }

  function pileOnMotion(e){
    const a = e.accelerationIncludingGravity;
    if(!a) return;
    const d = Math.abs(Math.hypot(a.x || 0, a.y || 0, a.z || 0) - 9.81);
    const now = performance.now();
    if(d > 9 && now - pileLastShake > 300){
      pileLastShake = now;
      pileKick(Math.min(1.5, d / 14));
    }
  }

  function pileAttachSensors(){
    window.addEventListener('deviceorientation', pileOnOrient);
    window.addEventListener('devicemotion', pileOnMotion);
  }
  function pileDetachSensors(){
    window.removeEventListener('deviceorientation', pileOnOrient);
    window.removeEventListener('devicemotion', pileOnMotion);
  }

  pileMotionBtn.addEventListener('click', async () => {
    try{
      const req = (window.DeviceMotionEvent && DeviceMotionEvent.requestPermission)
        ? DeviceMotionEvent.requestPermission.bind(DeviceMotionEvent)
        : DeviceOrientationEvent.requestPermission.bind(DeviceOrientationEvent);
      const res = await req();
      if(res !== 'granted'){ showToast('Motion access was denied'); return; }
      pileDetachSensors(); pileAttachSensors();
    }catch(err){ showToast("Couldn't enable motion"); }
  });
  document.getElementById('pileShakeBtn').addEventListener('click', () => pileKick(1));

  // ----- loop + draw -----
  function pileDraw(){
    const c = pileCtx;
    c.setTransform(pileDpr, 0, 0, pileDpr, 0, 0);
    c.clearRect(0, 0, pileW, pileH);
    const s = pileCupH;
    pileBodies.forEach(b => {
      const img = pileImgs[b.cupType];
      if(!img.complete) return;
      c.save();
      c.translate(b.position.x, b.position.y);
      c.rotate(b.angle);
      c.drawImage(img, -s / 2, -s / 2, s, s);
      c.restore();
    });
  }

  function pileLoop(ts){
    if(!pileActive) return;
    pileRAF = requestAnimationFrame(pileLoop);
    const dt = Math.min(50, ts - (pileLast || ts));
    pileLast = ts;
    if(!pileEngine) return;

    pileSpawnT += dt;
    while(pileQueue.length && pileSpawnT > 55){
      pileSpawnT -= 55;
      pileAddCup(pileQueue.shift());
    }

    const g = pileEngine.gravity;
    g.x += (pileTilt.x - g.x) * 0.18;
    g.y += (pileTilt.y - g.y) * 0.18;

    pileAcc += dt;
    while(pileAcc >= PILE_STEP){
      Matter.Engine.update(pileEngine, PILE_STEP);
      pileAcc -= PILE_STEP;
    }
    pileDraw();
  }

  // ----- data + sugar card -----
  function pileTween(el, to, suffix){
    const from = parseFloat(el.dataset.v || '0') || 0;
    el.dataset.v = to;
    const t0 = performance.now(), dur = 600;
    (function step(now){
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(from + (to - from) * e) + (suffix || '');
      if(k < 1) requestAnimationFrame(step);
    })(t0);
  }

  function pileUpdateSugar(hot, ice){
    const total = hot * SUGAR_HOT_G + ice * SUGAR_ICE_G;
    const daysInMonth = new Date(pileYear, pileMonth + 1, 0).getDate();
    const isCurrent = pileYear === today.getFullYear() && pileMonth === today.getMonth();
    const days = isCurrent ? today.getDate() : daysInMonth;
    const isPast = pileYear * 12 + pileMonth < today.getFullYear() * 12 + today.getMonth();
    const avg = (isCurrent || isPast) ? total / days : 0;

    pileTween(document.getElementById('sugarTotal'), total);
    pileTween(document.getElementById('sugarSpoons'), Math.round(total / SUGAR_TSP_G));
    const fill = document.getElementById('sugarBarFill');
    const ratio = avg / SUGAR_DAILY_LIMIT_G;
    fill.style.width = Math.min(100, ratio * 100) + '%';
    fill.classList.toggle('over', ratio > 1);
    document.getElementById('sugarAvg').textContent = total ? `${avg.toFixed(1)} g per day on average` : 'No drinks logged';
    document.getElementById('sugarLimit').textContent = `limit ${SUGAR_DAILY_LIMIT_G} g/day`;
    document.getElementById('sugarNote').textContent =
      `Estimate for kopi gula aren: hot ${hot} × ${SUGAR_HOT_G} g + cold ${ice} × ${SUGAR_ICE_G} g.`;
  }

  function pileSetEntries(obj){
    const list = Object.keys(obj).map(k => ({ d: Number(k.split('-')[2]), t: obj[k] })).sort((a, b) => a.d - b.d);
    const sig = pileYear + '-' + pileMonth + ':' + list.map(e => e.d + e.t).join(',');
    if(sig === pileSig) return;
    pileSig = sig;
    const types = list.map(e => e.t === 'ice' ? 'ice' : 'hot');
    pileUpdateSugar(types.filter(t => t === 'hot').length, types.filter(t => t === 'ice').length);
    if(!window.Matter){ pileEmptyEl.textContent = "Physics couldn't load. Check your connection."; pileEmptyEl.classList.remove('hidden'); }
    else if(!types.length){ pileEmptyEl.textContent = 'No drinks logged this month.'; pileEmptyEl.classList.remove('hidden'); }
    else pileEmptyEl.classList.add('hidden');
    pileSpawn(types);
  }

  async function pileLoad(){
    const seq = ++pileSeq;
    document.getElementById('pileMonthTitle').textContent = `${MONTH_NAMES[pileMonth]} ${pileYear}`;
    const cached = monthCache[ymKey(pileYear, pileMonth)];
    if(cached) pileSetEntries(cached);
    if(!currentUser) return;
    const start = isoDate(pileYear, pileMonth, 1);
    const end = isoDate(pileYear, pileMonth, new Date(pileYear, pileMonth + 1, 0).getDate());
    const { data, error } = await sb.from('coffeelog_entries')
      .select('entry_date, drink_type')
      .eq('user_id', currentUser.id)
      .gte('entry_date', start)
      .lte('entry_date', end);
    if(seq !== pileSeq || !pileActive) return;
    if(error){ showToast("Couldn't load data"); return; }
    const obj = {};
    (data || []).forEach(row => {
      const [y, m, d] = row.entry_date.split('-').map(Number);
      obj[keyFor(y, m - 1, d)] = row.drink_type;
    });
    pileSetEntries(obj);
  }

  function pileEnter(){
    pileActive = true;
    pileYear = viewYear; pileMonth = viewMonth; pileSig = null;
    pileEnsureEngine();
    pileMeasure();
    pileAttachSensors();
    setTimeout(() => {
      if(pileActive && !pileHasSensor && navigator.maxTouchPoints > 0 && window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function'){
        pileMotionBtn.classList.remove('hidden');
      }
    }, 700);
    pileLoad();
    pileLast = 0;
    cancelAnimationFrame(pileRAF);
    pileRAF = requestAnimationFrame(pileLoop);
  }

  function pileLeave(){
    pileActive = false;
    cancelAnimationFrame(pileRAF);
    pileDetachSensors();
  }

  function pileChangeMonth(step){
    pileMonth += step;
    if(pileMonth < 0){ pileMonth = 11; pileYear--; }
    if(pileMonth > 11){ pileMonth = 0; pileYear++; }
    pileLoad();
  }
  document.getElementById('pilePrev').addEventListener('click', () => pileChangeMonth(-1));
  document.getElementById('pileNext').addEventListener('click', () => pileChangeMonth(1));

  if('ResizeObserver' in window){
    new ResizeObserver(() => { if(pileActive) pileMeasure(); }).observe(pileStageEl);
  }

  // ---------- Bottom nav switching ----------
  const screens = {
    calendar: document.getElementById('screen-calendar'),
    stats: document.getElementById('screen-stats'),
    pile: document.getElementById('screen-pile'),
    profile: document.getElementById('screen-profile'),
  };
  const navItems = document.querySelectorAll('.nav-item');
  const screensWrap = document.querySelector('.screens');

  function switchScreen(target){
    navItems.forEach(n => n.classList.toggle('active', n.dataset.target === target));
    Object.keys(screens).forEach(key => {
      screens[key].classList.toggle('hidden', key !== target);
    });
    screensWrap.scrollTop = 0;
    if(target === 'stats') loadYearStats();
    if(target === 'pile') pileEnter(); else if(pileActive) pileLeave();
  }

  navItems.forEach(item => {
    item.addEventListener('click', () => switchScreen(item.dataset.target));
  });

  // ---------- Details card -> jump to that month on the calendar ----------
  document.getElementById('detailCard').addEventListener('click', () => {
    viewYear = statsYear;
    viewMonth = selectedMonthIdx;
    switchScreen('calendar');
    loadMonthEntries();
  });

</script>
