<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Umur Cam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d12; --surf:#151922; --surf2:#1e2430; --tx:#eef1f6; --mut:#8a93a6;
  --acc:#5eead4; --acc-tx:#04201c; --ok:#4ade80; --err:#ff6b6b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg{display:block}

/* layar awal */
.start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
body.live .start{display:none}
.card{max-width:380px;text-align:center}
.icon{width:56px;height:56px;margin:0 auto 20px;color:var(--acc)}
.card h1{font-size:24px;font-weight:800;letter-spacing:-.01em;margin-bottom:10px}
.card p{font-size:14px;line-height:1.6;color:var(--mut);font-weight:500}
.go{margin-top:24px;background:var(--acc);color:var(--acc-tx);border-radius:999px;padding:14px 28px;
  font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:10px}
.go:disabled{opacity:.6;cursor:default}
.go svg{width:18px;height:18px}
.alt{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px auto 0;padding:8px 12px;
  font-size:13px;font-weight:600;color:var(--mut)}
.alt svg{width:16px;height:16px}
.note{margin-top:22px;font-size:12px;line-height:1.6;color:#66716b}

/* tampilan kamera: memenuhi seluruh area browser (bukan fullscreen layar) */
#vid{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.stage{position:fixed;inset:0;width:100vw;height:100dvh;background:#000;display:none}
body.live .stage{display:block}
#view{display:block;width:100%;height:100%;object-fit:contain}

.pill{position:absolute;left:12px;top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;
  background:rgba(11,13,18,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
.pill.busy .dot{background:var(--acc);animation:pulse 1s ease-in-out infinite}
.pill.ok .dot{background:var(--ok)}
.pill.err .dot{background:var(--err)}
@keyframes pulse{50%{opacity:.25}}

.ctrl{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:14px}
.rb{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;
  background:rgba(12,14,13,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.rb:active{transform:scale(.94)}
.rb svg{width:22px;height:22px}
</style>
</head>
<body>
<div class="start" id="start">
  <div class="card">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 10h.01M15 10h.01"/><path d="M9.5 14.5c.6.6 1.4 1 2.5 1s1.9-.4 2.5-1"/></svg>
    <h1>Umur Cam</h1>
    <p>Perkiraan kisaran umur dari wajah lewat kamera. Bisa banyak wajah sekaligus.</p>
    <button class="go" id="camBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      Nyalakan kamera
    </button>
    <button class="alt" id="imgBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m20 16-4.5-4.5L8 19"/></svg>
      Coba dari foto
    </button>
    <p class="note">Ini cuma estimasi, bisa meleset beberapa tahun. Diproses langsung di browser, video tidak dikirim ke mana pun.</p>
  </div>
</div>

<video id="vid" playsinline muted></video>
<div class="stage" id="stage">
  <canvas id="view"></canvas>
  <div class="pill busy" id="pill"><span class="dot"></span><span id="pillTx">Menyiapkan…</span></div>
  <div class="ctrl">
    <button class="rb" id="flipBtn" aria-label="Ganti kamera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5"/><path d="M20 4v4.5h-4.5"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.5"/><path d="M4 20v-4.5h4.5"/></svg>
    </button>
    <button class="rb" id="stopBtn" aria-label="Matikan kamera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
</div>
<input type="file" id="file" accept="image/*" hidden>

<script>
/* ============================================================
   PURE FUNCTIONS (tanpa DOM) — dipisah supaya gampang dites
   ============================================================ */
/*PURE-START*/
function iou(a,b){
  const x1=Math.max(a.x,b.x), y1=Math.max(a.y,b.y);
  const x2=Math.min(a.x+a.w,b.x+b.w), y2=Math.min(a.y+a.h,b.y+b.h);
  const iw=x2-x1, ih=y2-y1;
  if(iw<=0||ih<=0) return 0;
  const inter=iw*ih;
  return inter/(a.w*a.h+b.w*b.h-inter);
}

/* rata-rata setelah buang 20% terkecil dan terbesar, biar tahan outlier */
function trimmedMean(arr){
  const s=arr.slice().sort((a,b)=>a-b);
  const cut=Math.floor(s.length*0.2);
  const m=s.slice(cut,s.length-cut);
  const use=m.length?m:s;
  return use.reduce((a,b)=>a+b,0)/use.length;
}

/* dari daftar prediksi umur -> kisaran. Margin melebar untuk umur lebih tua
   dan saat sampel masih sedikit. */
function ageRange(samples){
  const est=trimmedMean(samples);
  let m=Math.round(2.5+est*0.05);
  if(samples.length<5) m+=2;
  const lo=Math.max(1,Math.round(est-m));
  const hi=Math.round(est+m);
  return {est, lo, hi, stable:samples.length>=5};
}
/*PURE-END*/

/* ============================================================
   APP
   ============================================================ */
const $=s=>document.querySelector(s);
const view=$('#view'), c=view.getContext('2d'), video=$('#vid'), stage=$('#stage');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ACC='#5eead4';
const LIB='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js';
const MODELS='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model/';
const MP='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const FD_MODEL='https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite';

const st={source:null,img:null,stream:null,facing:'user',mirror:true,running:false,runId:0,
  ready:false,detector:null,lastVT:-1,imgDone:false,tracks:[],nextId:1,sw:1,sh:1,count:-1};

/* ---------- status ---------- */
function setStatus(tx,kind){
  $('#pillTx').textContent=tx;
  $('#pill').className='pill '+(kind||'busy');
}

/* ---------- muat library + model ---------- */
function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Gagal memuat '+src));
    document.head.appendChild(s);
  });
}
let libsPromise=null;
function loadLibs(){
  if(libsPromise) return libsPromise;
  libsPromise=(async()=>{
    try{ await document.fonts.load('800 16px "Plus Jakarta Sans"'); }catch(e){}
    setStatus('Memuat model wajah…','busy');
    try{
      // 1) detektor wajah cepat (MediaPipe)
      const mp=await import(MP+'/+esm');
      const fs=await mp.FilesetResolver.forVisionTasks(MP+'/wasm');
      const mk=d=>mp.FaceDetector.createFromOptions(fs,{
        baseOptions:{modelAssetPath:FD_MODEL,delegate:d},
        runningMode:'VIDEO',minDetectionConfidence:0.5
      });
      try{ st.detector=await mk('GPU'); }catch(e){ st.detector=await mk('CPU'); }
      // 2) model umur (face-api)
      setStatus('Memuat model umur…','busy');
      await loadScript(LIB);
      try{ await faceapi.tf.ready(); }catch(e){}
      await faceapi.nets.ageGenderNet.loadFromUri(MODELS);
      st.ready=true;
    }catch(e){
      console.warn(e);
      libsPromise=null;           // boleh dicoba lagi
      setStatus('Model gagal dimuat, cek internet','err');
    }
  })();
  return libsPromise;
}

/* ---------- sumber: kamera / foto ---------- */
function setSourceSize(w,h){
  st.sw=w; st.sh=h;
  const vw=Math.min(w,960);
  view.width=vw; view.height=Math.round(h*vw/w);
}
function stopSource(keepLive){
  if(!keepLive) document.body.classList.remove('live');   // keepLive: ganti kamera tanpa balik ke layar awal
  st.running=false; st.runId++;
  if(st.stream){ st.stream.getTracks().forEach(t=>t.stop()); st.stream=null; }
  video.srcObject=null; st.img=null; st.source=null;
  st.tracks=[]; st.count=-1;
  if(!keepLive) stage.classList.remove('live');
}
async function startCam(){
  stopSource(true);
  $('#camBtn').disabled=true;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{facingMode:{ideal:st.facing},width:{ideal:1280},height:{ideal:720}}
    });
    st.stream=stream; video.srcObject=stream;
    await video.play();
    await new Promise(r=>{ if(video.videoWidth) r(); else video.onloadedmetadata=()=>r(); });
    st.source='cam'; st.mirror=(st.facing==='user');
    setSourceSize(video.videoWidth,video.videoHeight);
    beginRun();
  }catch(e){
    console.warn(e);
    stopSource();
    alert(e&&e.name==='NotAllowedError'
      ? 'Izin kamera ditolak. Aktifkan izin kamera untuk situs ini di pengaturan browser.'
      : 'Kamera tidak bisa dibuka: '+(e&&e.message||e));
  }finally{ $('#camBtn').disabled=false; }
}
function startImage(file){
  stopSource(true);
  const url=URL.createObjectURL(file);
  const im=new Image();
  im.onload=()=>{
    st.source='img'; st.mirror=false;
    const w=Math.min(im.naturalWidth,1600), h=Math.round(im.naturalHeight*w/im.naturalWidth);
    // foto digambar ke canvas, jadi koordinat deteksi dan crop sama-sama di ruang w×h
    const fr=document.createElement('canvas'); fr.width=w; fr.height=h;
    fr.getContext('2d').drawImage(im,0,0,w,h);
    st.img=fr;
    setSourceSize(w,h);
    beginRun();
    URL.revokeObjectURL(url);
  };
  im.onerror=()=>alert('Foto tidak bisa dibuka.');
  im.src=url;
}
function srcEl(){ return st.source==='cam'?video:st.img; }
function beginRun(){
  st.running=true; st.tracks=[]; st.count=-1; st.lastVT=-1; st.imgDone=false;
  const id=++st.runId;
  stage.classList.add('live');
  document.body.classList.add('live');
  setStatus(st.ready?'Mencari wajah…':'Menyiapkan…', st.ready?'ok':'busy');
  loadLibs().then(()=>{
    if(id!==st.runId||!st.ready) return;
    setStatus('Mencari wajah…','ok');
  });
  requestAnimationFrame(render);
  ageLoop(id);
}

/* ---------- deteksi wajah (cepat, jalan di setiap frame) ---------- */
function detectFaces(){
  if(!st.ready||!st.detector) return;
  const src=srcEl(); if(!src) return;
  if(st.source==='cam'){
    if(video.readyState<2||video.currentTime===st.lastVT) return;   // belum ada frame baru
    st.lastVT=video.currentTime;
  }else{
    if(st.imgDone) return;                                           // foto cukup sekali
    st.imgDone=true;
  }
  let res;
  try{ res=st.detector.detectForVideo(src,performance.now()); }
  catch(e){ console.warn(e); return; }
  const now=performance.now();
  const used=new Set();
  for(const dt of (res&&res.detections)||[]){
    const bb=dt.boundingBox; if(!bb) continue;
    const d={x:bb.originX,y:bb.originY,w:bb.width,h:bb.height};
    let best=null, bi=0.25;
    for(const t of st.tracks){
      if(used.has(t)) continue;
      const v=iou(t.b,d);
      if(v>bi){ bi=v; best=t; }
    }
    if(best){ used.add(best); best.b=d; best.seen=now; }
    else{
      const t={id:st.nextId++,b:d,d:{...d},ages:[],ageT:0,seen:now};
      used.add(t); st.tracks.push(t);
    }
  }
  if(st.source==='cam') st.tracks=st.tracks.filter(t=>now-t.seen<700);
  const n=st.tracks.length;
  if(n!==st.count){
    st.count=n;
    setStatus(n?(n+' wajah'):'Mencari wajah…', n?'ok':'busy');
  }
}

/* ---------- estimasi umur (lebih berat, jalan terpisah di belakang) ---------- */
const agC=document.createElement('canvas'); agC.width=agC.height=112;
const agx=agC.getContext('2d');
async function predictAge(t){
  const src=srcEl(); if(!src) return null;
  const b=t.b;
  const s=Math.max(b.w,b.h)*(1.05+Math.random()*0.25);   // sedikit variasi crop, hasilnya dirata-rata
  const cx=b.x+b.w/2, cy=b.y+b.h/2+b.h*0.03;
  agx.fillStyle='#000'; agx.fillRect(0,0,112,112);
  agx.drawImage(src,cx-s/2,cy-s/2,s,s,0,0,112,112);
  const p=await faceapi.nets.ageGenderNet.predictAgeAndGender(agC);
  const r=Array.isArray(p)?p[0]:p;
  return r&&isFinite(r.age)?r.age:null;
}
async function ageLoop(id){
  while(st.running&&id===st.runId){
    if(!st.ready){ await sleep(150); continue; }
    const now=performance.now();
    let pick=null;
    for(const t of st.tracks){
      const n=t.ages.length;
      if(st.source==='img'){ if(n>=8) continue; }
      else if(n>=5&&now-t.ageT<600) continue;            // sudah stabil: cukup ~2x per detik
      if(!pick||n<pick.ages.length||(n===pick.ages.length&&t.ageT<pick.ageT)) pick=t;
    }
    if(!pick){ await sleep(80); continue; }
    pick.ageT=now;
    try{
      const age=await predictAge(pick);
      if(id!==st.runId) return;
      if(age!=null&&st.tracks.includes(pick)){
        pick.ages.push(age); if(pick.ages.length>16) pick.ages.shift();
      }
    }catch(e){ console.warn(e); await sleep(300); }
    await sleep(30);
  }
}

/* ---------- render ---------- */
function rrect(x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r);
  c.closePath();
}
function brackets(x,y,w,h,len){
  c.beginPath();
  c.moveTo(x,y+len); c.lineTo(x,y); c.lineTo(x+len,y);
  c.moveTo(x+w-len,y); c.lineTo(x+w,y); c.lineTo(x+w,y+len);
  c.moveTo(x+w,y+h-len); c.lineTo(x+w,y+h); c.lineTo(x+w-len,y+h);
  c.moveTo(x+len,y+h); c.lineTo(x,y+h); c.lineTo(x,y+h-len);
  c.stroke();
}
const FONT=(w,s)=>`${w} ${s}px "Plus Jakarta Sans",system-ui,sans-serif`;

function render(){
  if(!st.running) return;
  const W=view.width, H=view.height, src=srcEl();
  if(src){
    c.save();
    if(st.mirror){ c.translate(W,0); c.scale(-1,1); }
    try{ c.drawImage(src,0,0,W,H); }catch(e){}
    c.restore();
  }
  detectFaces();
  drawOverlay(W,H);
  requestAnimationFrame(render);
}

function drawOverlay(W,H){
  // 1 px layar = u px canvas, supaya teks ukurannya sama di semua perangkat
  const ds=Math.min(view.clientWidth/W,view.clientHeight/H)||1;
  const u=Math.min(4,Math.max(0.8,1/ds));
  const sx=W/st.sw;

  for(const t of st.tracks){
    const k=0.35;
    t.d.x+=(t.b.x-t.d.x)*k; t.d.y+=(t.b.y-t.d.y)*k;
    t.d.w+=(t.b.w-t.d.w)*k; t.d.h+=(t.b.h-t.d.h)*k;

    const pad=t.d.w*0.06;
    let bw=(t.d.w+pad*2)*sx, bh=(t.d.h+pad*2)*sx;
    let bx=(t.d.x-pad)*sx, by=(t.d.y-pad)*sx;
    if(st.mirror) bx=W-bx-bw;

    c.strokeStyle=ACC; c.lineWidth=3*u; c.lineCap='round'; c.lineJoin='round';
    if(!t.ages.length){                       // belum ada hasil umur: kotak saja
      c.globalAlpha=0.7;
      brackets(bx,by,bw,bh,Math.min(bw,bh)*0.22);
      c.globalAlpha=1;
      continue;
    }
    const r=ageRange(t.ages);
    c.globalAlpha=r.stable?1:0.7;
    brackets(bx,by,bw,bh,Math.min(bw,bh)*0.22);

    // label
    const num=r.lo+'–'+r.hi;
    c.font=FONT(800,22*u); const nw=c.measureText(num).width;
    c.font=FONT(600,12*u); const unit=r.stable?'tahun':'mengukur…';
    const uw=c.measureText(unit).width;
    const px=12*u, py=9*u;
    const lw=Math.max(nw,uw)+px*2, lh=22*u+12*u+py*2+14*u;   // angka + satuan + skala
    let lx=bx+bw/2-lw/2, ly=by+bh+10*u;
    if(ly+lh>H-4*u) ly=by-lh-10*u;                           // kalau mentok bawah, taruh di atas
    lx=Math.max(4*u,Math.min(W-lw-4*u,lx)); ly=Math.max(4*u,ly);

    c.fillStyle='rgba(11,13,18,.78)'; rrect(lx,ly,lw,lh,12*u); c.fill();
    c.textBaseline='alphabetic'; c.textAlign='center';
    c.fillStyle='#fff'; c.font=FONT(800,22*u); c.fillText(num,lx+lw/2,ly+py+19*u);
    c.fillStyle='#8a93a6'; c.font=FONT(600,12*u); c.fillText(unit,lx+lw/2,ly+py+34*u);

    // skala 0–80 tahun
    const tx=lx+px, tw=lw-px*2, ty=ly+lh-py-3*u, th=4*u;
    c.fillStyle='rgba(255,255,255,.18)'; rrect(tx,ty,tw,th,th/2); c.fill();
    const a=Math.min(1,r.lo/80), z=Math.min(1,r.hi/80);
    c.fillStyle=ACC; rrect(tx+tw*a,ty,Math.max(th,tw*(z-a)),th,th/2); c.fill();
    c.globalAlpha=1;
  }
  c.textAlign='left';
}

/* ---------- kontrol ---------- */
$('#camBtn').onclick=()=>startCam();
$('#stopBtn').onclick=()=>stopSource();
$('#flipBtn').onclick=()=>{
  st.facing=st.facing==='user'?'environment':'user';
  startCam();
};
$('#imgBtn').onclick=()=>$('#file').click();
$('#file').onchange=e=>{
  const f=e.target.files&&e.target.files[0];
  if(f) startImage(f);
  e.target.value='';
};
</script>
</body>
</html>
