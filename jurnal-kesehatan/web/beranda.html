<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon.png">
<title>Jurnal Sehat — Beranda</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --cream: #F4EFE6; --white: #FFFFFF; --dark: #1A1A1A; --gray: #888;
  --gray-light: #E8E3DA; --yellow: #EDE84A; --pink: #F0A8C2;
  --pink-soft: #FAD9EA; --green: #AEDBA6; --green-dark: #4A8E42;
  --blue-soft: #C2DFF7; --red: #E53935;
  --radius: 20px; --radius-sm: 12px;
  --font: 'Plus Jakarta Sans', sans-serif;
  --input-bg: var(--cream); --input-focus: #EDEAE0;
}
body.dark {
  --cream: #161819; --white: #242529; --dark: #F0EDE6; --gray: #777;
  --gray-light: #2E3033; --yellow: #EDE84A; --pink: #F0A8C2;
  --pink-soft: #3D2535; --green: #1A3318; --green-dark: #6DB860;
  --blue-soft: #1A2D3D; --input-bg: #1E2022; --input-focus: #252729;
}
body.dark .scard.yellow { background:#242529; }
body.dark .scard.yellow .scard-label  { color:var(--yellow);opacity:.7; }
body.dark .scard.yellow .scard-unit   { color:var(--yellow);opacity:.6; }
body.dark .scard.yellow .streak-prog-label { color:var(--yellow);opacity:.7; }
body.dark .scard.yellow .scard-num    { color:var(--yellow); }
body.dark .scard.yellow .scard-icon   { fill:var(--yellow);opacity:.5; }
body.dark .scard.pink   { background:#242529; }
body.dark .scard.pink .scard-label    { color:var(--pink);opacity:.7; }
body.dark .scard.pink .scard-unit     { color:var(--pink);opacity:.6; }
body.dark .scard.pink .scard-num      { color:var(--pink); }
body.dark .scard.pink .scard-icon     { fill:var(--pink);opacity:.6; }
body.dark .scard.dark   { background:#242529; }
body.dark .scard.dark .scard-label    { color:var(--dark);opacity:.6; }
body.dark .scard.dark .scard-num      { color:var(--yellow); }
body.dark .scard.dark .scard-unit     { color:var(--dark);opacity:.6; }
body.dark .tl-card      { background:#242529; }
body.dark .tl-line      { background:#2E3033; }
body.dark .modal        { background:#1E2022; }
body.dark .confirm-box  { background:#18191B; }
body.dark .modal .form-input,
body.dark .modal .form-textarea { background:#2A2D32; color:var(--dark); }
body.dark .modal .form-input:focus,
body.dark .modal .form-textarea:focus { background:#313438; }
body.dark .tag           { background:#2E3033;color:#bbb; }
body.dark .tag.symp      { background:#1A2D3D;color:#7EC8F0; }
body.dark .qchip         { background:#2E3033;color:#bbb; }
body.dark .qchip.selected{ background:#F0EDE6;color:#161819; }
body.dark .dur-badge     { background:#1A3318;color:#6DB860; }
body.dark .dur-badge.ill { background:#3D2535;color:#F0A8C2; }
body.dark .btn-ic        { background:#2A2D32; }
body.dark .btn-ic svg    { fill:#aaa; }
body.dark .btn-ic:active { background:#1E2124; }
body.dark .check-row     { background:var(--input-bg); }
body.dark .btn-cancel-m  { background:#2E3033;color:#bbb; }
body.dark .btn-save      { background:var(--yellow);color:#1A1A1A; }
body.dark .btn-add-s     { background:var(--yellow);color:#1A1A1A; }
body.dark .streak-prog-bg  { background:rgba(255,255,255,.1); }
body.dark .streak-prog-fill { background:rgba(237,232,74,.45); }
body.dark .insight-card  { background:#1A2D3D; }
body.dark .cf-btns .btn-neu { background:#2E3033;color:#ccc; }
body.dark .acc-pill      { background:#2E3033;color:#666; }
body.dark .acc-pill.active { background:var(--yellow);color:#1A1A1A; }

* { margin:0;padding:0;box-sizing:border-box; }
body {
  font-family:var(--font);background:var(--cream);color:var(--dark);
  min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;
}
.hidden { display:none !important; }
.svg-sprite { display:none;position:absolute; }
@keyframes spin { to{transform:rotate(360deg)} }

/* ═══ SIDEBAR ═══ */
.app-shell { display:flex;min-height:100vh; }
.sidebar {
  width:252px;flex-shrink:0;background:#1A1A1A;color:#F4EFE6;
  display:flex;flex-direction:column;padding:26px 18px;
  position:fixed;top:0;left:0;bottom:0;overflow-y:auto;
}
body.dark .sidebar { background:#0F1011; }
.sidebar-logo { display:flex;align-items:center;gap:10px;padding:0 8px;margin-bottom:28px; }
.sidebar-logo svg { width:24px;height:24px;flex-shrink:0; }
.sidebar-logo span { font-size:17px;font-weight:800;letter-spacing:-.3px;color:#F4EFE6; }
.sidebar-add {
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--pink);color:#1A1A1A;border:none;border-radius:14px;
  padding:13px;font-family:var(--font);font-size:14px;font-weight:700;
  cursor:pointer;margin-bottom:22px;transition:background .15s,transform .1s;
}
.sidebar-add:hover { background:#e891b3; }
.sidebar-add:active { transform:scale(.98); }
.sidebar-add svg { width:16px;height:16px;fill:#1A1A1A; }
.sidebar-nav { display:flex;flex-direction:column;gap:3px; }
.sidebar-link {
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:13px;
  color:rgba(244,239,230,.55);text-decoration:none;font-size:14px;font-weight:600;
  transition:background .15s,color .15s;
}
.sidebar-link svg { width:18px;height:18px;fill:currentColor;flex-shrink:0; }
.sidebar-link:hover { background:rgba(255,255,255,.06);color:#F4EFE6; }
.sidebar-link.active { background:var(--yellow);color:#1A1A1A; }
.sidebar-spacer { flex:1; }
.sidebar-foot { margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:14px; }
.sidebar-account-label { font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:rgba(244,239,230,.4);padding:0 2px; }
.sidebar-accounts { display:flex;flex-wrap:wrap;gap:6px; }
.sidebar-acc-pill {
  background:rgba(255,255,255,.08);border:none;border-radius:50px;
  padding:6px 12px;font-family:var(--font);font-size:12px;font-weight:700;
  color:rgba(244,239,230,.65);cursor:pointer;transition:background .15s,color .15s;
}
.sidebar-acc-pill.active { background:var(--yellow);color:#1A1A1A; }
.sidebar-acc-pill:hover:not(.active) { background:rgba(255,255,255,.14); }
.sidebar-dark-row { display:flex;align-items:center;justify-content:space-between; }
.sidebar-dark-row span { font-size:13px;font-weight:600;color:rgba(244,239,230,.7); }
.sidebar .btn-darkmode { background:rgba(255,255,255,.08); }
.sidebar .btn-darkmode svg { fill:#F4EFE6; }
.sidebar-user { display:flex;align-items:center;gap:10px; }
.sidebar-user img { width:32px;height:32px;border-radius:50%;flex-shrink:0;object-fit:cover;border:2px solid rgba(255,255,255,.12); }
.sidebar-user-info { flex:1;min-width:0; }
.sidebar-user-name { font-size:12.5px;font-weight:700;color:#F4EFE6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.sidebar-user-email { font-size:10.5px;color:rgba(244,239,230,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.sidebar-logout {
  display:flex;align-items:center;gap:7px;background:none;border:none;
  color:rgba(244,239,230,.5);font-family:var(--font);font-size:12.5px;font-weight:600;
  cursor:pointer;padding:2px;transition:color .15s;
}
.sidebar-logout:hover { color:#FF8A8A; }
.sidebar-logout svg { width:14px;height:14px;fill:currentColor; }

/* ═══ MAIN CONTENT ═══ */
.main-content { margin-left:252px;flex:1;padding:40px 48px 60px;max-width:820px; }
.page-header { display:flex;align-items:baseline;justify-content:space-between;margin-bottom:26px; }
.page-title { font-size:27px;font-weight:800;letter-spacing:-.6px; }
.page-date { font-size:13px;color:var(--gray); }

.grid-2 { display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px; }
.scard { border-radius:var(--radius);padding:22px;position:relative;overflow:hidden; }
.scard.yellow { background:var(--yellow); }
.scard.pink   { background:var(--pink-soft); }
.scard.dark   { background:var(--dark);margin-bottom:14px; }
.scard.dark .scard-label  { color:var(--white); }
.scard.dark .scard-num    { color:var(--yellow);font-size:26px;letter-spacing:-.5px; }
.scard.dark .scard-unit   { color:var(--white); }
.scard-label  { font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;opacity:.6;margin-bottom:8px; }
.scard-num    { font-size:46px;font-weight:800;line-height:1;letter-spacing:-1px; }
.scard-unit   { font-size:13px;opacity:.6;margin-top:4px;font-weight:500; }
.scard-icon   { position:absolute;top:18px;right:18px;width:24px;height:24px;opacity:.45; }
.scard.yellow .scard-icon { fill:#1A1A1A; }
.scard.pink   .scard-icon { fill:#B03070;opacity:.55; }
.scard.dark   .scard-icon { opacity:.35;fill:var(--white); }
.scard-row    { display:flex;justify-content:space-between;align-items:center; }
.scard-right  { width:40px;height:40px;opacity:.6; }
.streak-prog-wrap  { margin-top:12px; }
.streak-prog-label { font-size:12px;opacity:.65;margin-bottom:6px;font-weight:600; }
.streak-prog-bg    { height:6px;background:rgba(0,0,0,.15);border-radius:3px;overflow:hidden; }
.streak-prog-fill  { height:100%;background:rgba(0,0,0,.35);border-radius:3px;transition:width .6s; }

.insight-card { background:var(--blue-soft);border-radius:var(--radius-sm);padding:15px 16px;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px; }
.insight-icon { width:20px;height:20px;flex-shrink:0;margin-top:1px; }
.insight-text { font-size:14px;font-weight:600;line-height:1.5;color:var(--dark); }
.insight-sub  { font-size:11.5px;font-weight:400;color:#555;margin-top:2px; }

.sec-title { font-size:16px;font-weight:700;margin:28px 0 12px;display:flex;justify-content:space-between;align-items:center; }
.sec-sub   { font-size:13px;font-weight:500;color:var(--gray);cursor:pointer;text-decoration:none; }
.sec-sub:hover { color:var(--dark); }

.timeline { display:flex;flex-direction:column;max-width:640px; }
.tl-item  { display:flex;gap:12px; }
.tl-spine { display:flex;flex-direction:column;align-items:center;padding-top:20px;width:20px;flex-shrink:0; }
.tl-dot   { width:10px;height:10px;border-radius:50%;flex-shrink:0; }
.tl-dot.ok  { background:var(--green-dark); }
.tl-dot.ill { background:var(--pink); }
.tl-line  { width:2px;background:var(--gray-light);flex:1;min-height:16px;margin-top:3px; }
.tl-card  { flex:1;background:var(--white);border-radius:var(--radius);padding:16px;margin-bottom:10px;transition:box-shadow .15s; }
.tl-card:hover { box-shadow:0 4px 18px rgba(0,0,0,.06); }
.tl-head  { display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px; }
.tl-name  { font-size:15px;font-weight:700;line-height:1.2; }
.tl-date  { font-size:11.5px;color:var(--gray);margin-top:2px; }
.tl-actions { display:flex;gap:5px;flex-shrink:0; }
.btn-ic   { background:var(--cream);border:none;border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s; }
.btn-ic svg { width:15px;height:15px; }
.btn-ic:hover { background:var(--gray-light); }
.tags-wrap { display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px; }
.tag      { background:var(--cream);border-radius:50px;padding:3px 9px;font-size:11px;font-weight:600; }
.tag.symp { background:var(--blue-soft);color:#1A5A8A; }
.tl-foot  { display:flex;justify-content:space-between;align-items:center; }
.dur-badge { font-size:11px;font-weight:700;padding:3px 10px;border-radius:50px;background:var(--green);color:var(--green-dark); }
.dur-badge.ill { background:var(--pink-soft);color:#B03070; }
.tl-ago   { font-size:11px;color:var(--gray);font-weight:500; }
.tl-note  { font-size:12px;color:var(--gray);border-top:1px solid var(--gray-light);padding-top:8px;margin-top:8px;line-height:1.5;font-style:italic; }

.empty    { text-align:center;padding:48px 20px;color:var(--gray); }
.empty-icon { width:52px;height:52px;margin:0 auto 14px;opacity:.35;display:block; }
.empty h3 { font-size:16px;color:var(--dark);margin-bottom:6px;font-weight:700; }
.empty p  { font-size:13px;line-height:1.6; }

/* ═══ MODAL & OVERLAY (dipakai tombol + Catat Sakit di sidebar) ═══ */
.overlay { position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(3px);z-index:200;display:none;align-items:center;justify-content:center; }
.overlay.open { display:flex; }
.modal { background:var(--white);border-radius:26px;width:100%;max-width:480px;padding:26px 26px 30px;max-height:88vh;overflow-y:auto;animation:popIn .2s cubic-bezier(.34,1.4,.64,1); }
@keyframes popIn { from{transform:scale(.94);opacity:0} to{transform:scale(1);opacity:1} }
.modal-title { font-size:22px;font-weight:800;margin-bottom:18px;letter-spacing:-.3px; }
.form-group  { margin-bottom:14px; }
.form-label  { font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--gray);display:block;margin-bottom:6px; }
.form-input,.form-textarea { width:100%;padding:13px 14px;border:none;border-radius:var(--radius-sm);font-family:var(--font);font-size:15px;font-weight:500;color:var(--dark);background:var(--input-bg);outline:none;transition:background .2s; }
.form-input:focus,.form-textarea:focus { background:var(--input-focus); }
.form-textarea { min-height:72px;resize:vertical; }
.form-row  { display:grid;grid-template-columns:1fr 1fr;gap:10px; }
.symp-row  { display:flex;gap:8px;margin-bottom:8px; }
.symp-row .form-input { flex:1; }
.btn-add-s { background:var(--dark);color:var(--yellow);border:none;border-radius:var(--radius-sm);width:46px;font-size:22px;cursor:pointer;flex-shrink:0; }
.tags-edit { display:flex;flex-wrap:wrap;gap:5px;min-height:4px; }
.tag-rm    { background:var(--yellow);border-radius:50px;padding:4px 8px 4px 11px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;cursor:pointer; }
.tag-rm-x  { background:rgba(0,0,0,.15);border-radius:50%;width:15px;height:15px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800; }
.check-row { display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius-sm);cursor:pointer;background:var(--cream); }
.check-row input { width:17px;height:17px;accent-color:var(--dark);cursor:pointer; }
.check-row label { font-size:14px;font-weight:600;cursor:pointer; }
.btn-save     { width:100%;background:var(--dark);color:var(--yellow);border:none;border-radius:var(--radius);padding:15px;font-family:var(--font);font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;transition:transform .15s,opacity .15s; }
.btn-save:hover { opacity:.9; }
.btn-save:active { transform:scale(.98); }
.btn-cancel-m { width:100%;background:var(--cream);color:var(--gray);border:none;border-radius:var(--radius);padding:13px;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;margin-top:8px; }
.quick-symps { display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px; }
.qchip { background:var(--cream);border:none;border-radius:50px;padding:6px 13px;font-family:var(--font);font-size:12px;font-weight:600;color:var(--dark);cursor:pointer;transition:background .15s,color .15s; }
.qchip.selected { background:var(--dark);color:var(--yellow); }

.overlay-center { align-items:center; }
.confirm-box { background:var(--white);border-radius:24px;width:calc(100% - 48px);max-width:320px;padding:28px 22px;text-align:center;animation:popIn .2s cubic-bezier(.34,1.4,.64,1); }
.cf-emoji { font-size:44px;margin-bottom:10px; }
.cf-title { font-size:22px;font-weight:800;margin-bottom:7px;letter-spacing:-.3px; }
.cf-msg   { font-size:13px;color:var(--gray);line-height:1.6;margin-bottom:20px; }
.cf-btns  { display:flex;gap:8px; }
.btn-dng  { flex:1;background:#FF4C4C;color:#fff;border:none;border-radius:12px;padding:13px;font-family:var(--font);font-size:15px;font-weight:700;cursor:pointer; }
.btn-neu  { flex:1;background:var(--cream);color:var(--dark);border:none;border-radius:12px;padding:13px;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer; }

.toast { position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--dark);color:var(--white);padding:11px 20px;border-radius:50px;font-size:13px;font-weight:600;z-index:999;opacity:0;pointer-events:none;white-space:nowrap;transition:transform .3s cubic-bezier(.34,1.4,.64,1),opacity .25s; }
.toast.show { transform:translateX(-50%) translateY(0);opacity:1; }

.loading-screen { position:fixed;inset:0;background:var(--cream);z-index:550;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px; }
.loading-screen.hidden { display:none; }
.loading-spinner { width:36px;height:36px;border:3px solid var(--gray-light);border-top-color:var(--dark);border-radius:50%;animation:spin .7s linear infinite; }
.loading-txt { font-size:14px;font-weight:600;color:var(--gray); }

@media (max-width: 860px) {
  .sidebar { width:100%;height:auto;position:relative;flex-direction:row;align-items:center;padding:14px 18px;gap:16px; }
  .sidebar-logo { margin-bottom:0; }
  .sidebar-add,.sidebar-foot { display:none; }
  .sidebar-nav { flex-direction:row; }
  .app-shell { flex-direction:column; }
  .main-content { margin-left:0;max-width:100%;padding:28px 20px 60px; }
}
</style>
</head>
<body>

<script>
/* ═══════════════════════════════════════════════════════
   Logic KHUSUS web/beranda.html
   ═══════════════════════════════════════════════════════ */
var editId    = null;
var tempSymps = [];
var pendingCb = null;
var QUICK_SYMPS = ['Demam','Batuk','Pilek','Sakit kepala','Mual','Lemas','Nyeri tenggorokan','Diare'];

/* ═══ PROFIL (baca saja — kelola profil ada di Pengaturan) ═══ */
async function loadProfile() {
  const { data, error } = await sb.from('profiles').select('accounts').eq('id', currentUser.id).single();
  if (!error && data && data.accounts) {
    var valid = data.accounts.filter(function(a){ return a && a.key && a.label; });
    if (valid.length > 0) ACCOUNTS = valid;
  }
  renderSidebarAccounts();
}
function renderSidebarAccounts() {
  var html = ACCOUNTS.map(function(a,i){
    return '<button class="sidebar-acc-pill'+(i===curAccount?' active':'')+'" onclick="switchAccount('+i+')">'+a.emoji+' '+esc(a.label)+'</button>';
  }).join('');
  html += '<button class="sidebar-acc-pill" onclick="location.href=\'pengaturan.html\'" title="Kelola profil" style="font-size:14px;padding:6px 10px">+</button>';
  document.getElementById('sidebar-accounts').innerHTML = html;
}
function switchAccount(idx) {
  curAccount = idx;
  renderSidebarAccounts();
  appData = allData[curKey()] || [];
  renderAll();
  loadData();
}

/* ═══ RENDER HALAMAN ═══ */
function renderAll() {
  renderStreaks();
  renderTimeline('home-tl', 5);
  renderInsight('home-insight');
}

/* ═══ STREAK ═══ */
function renderStreaks() {
  var now=new Date(), today=todayStr(), yr=now.getFullYear(), jan1=yr+'-01-01';
  var thisYr=appData.filter(function(i){ return parseDt(i.startDate).getFullYear()===yr; });
  document.getElementById('sc-thisyear').textContent=thisYr.length;
  var streak=0, sortedThisYr=sortDesc(thisYr);
  if(thisYr.length===0){ streak=diffDays(jan1,today); }
  else { var last=sortedThisYr[0]; if(last.ongoing){ streak=0; } else { var ref=last.endDate||last.startDate; streak=diffDays(ref,today); if(streak<0) streak=0; } }
  document.getElementById('sc-streak').textContent=streak;
  var periods=buildStreakPeriodsForYear(yr);
  if(streak>0) periods.push(streak);
  var rec=0; for(var pi=0;pi<periods.length;pi++) if(periods[pi]>rec) rec=periods[pi];
  var pct=(rec>0)?Math.min(100,Math.round(streak/rec*100)):0;
  document.getElementById('sc-prog-fill').style.width=pct+'%';
  if(streak===0&&thisYr.length>0&&sortedThisYr[0].ongoing) document.getElementById('sc-prog-label').textContent='Sedang sakit';
  else if(rec===0) document.getElementById('sc-prog-label').textContent='Mulai streak-mu!';
  else if(streak>=rec) document.getElementById('sc-prog-label').textContent='Rekor terbaik tahun ini! \uD83D\uDD25';
  else document.getElementById('sc-prog-label').textContent=pct+'% menuju rekor ('+rec+' hari)';
  var allSorted=sortDesc(appData), lastIll=allSorted.length?allSorted[0]:null;
  if(lastIll){ document.getElementById('sc-last-name').textContent=lastIll.name; document.getElementById('sc-last-ago').textContent=lastIll.ongoing?'Sedang sakit':'Sembuh '+agoTxt(lastIll.endDate||lastIll.startDate); }
  else { document.getElementById('sc-last-name').textContent='\u2013'; document.getElementById('sc-last-ago').textContent='Belum ada data'; }
}
function buildStreakPeriodsForYear(yr) {
  var jan1=yr+'-01-01', dec31=yr+'-12-31', today=todayStr(), yearEnd=today<dec31?today:dec31;
  var relevant=appData.filter(function(i){ var s=parseDt(i.startDate).getFullYear(),e=i.endDate?parseDt(i.endDate).getFullYear():s; return s===yr||e===yr; });
  var sorted=sortDesc(relevant).reverse(), periods=[], cursor=jan1;
  for(var i=0;i<sorted.length;i++){ var ill=sorted[i], illStart=ill.startDate>jan1?ill.startDate:jan1, gap=diffDays(cursor,illStart); if(gap>0) periods.push(gap); var illEnd=ill.ongoing?yearEnd:(ill.endDate||ill.startDate); if(illEnd>cursor) cursor=illEnd; }
  var tail=diffDays(cursor,yearEnd); if(tail>0) periods.push(tail);
  return periods;
}

/* ═══ TIMELINE ═══ */
function renderTimeline(elId,limit) {
  var el=document.getElementById(elId), sorted=sortDesc(appData), list=(limit>0)?sorted.slice(0,limit):sorted;
  if(list.length===0){ el.innerHTML='<div class="empty"><svg class="empty-icon"><use href="#ic-empty"/></svg><h3>Belum Ada Riwayat</h3><p>Klik "Catat Sakit" di sidebar untuk mulai mencatat.</p></div>'; return; }
  var html='';
  for(var i=0;i<list.length;i++){
    var ill=list[i], isLast=(i===list.length-1), ongoing=!!ill.ongoing;
    var durDays=ongoing?Math.max(1,diffDays(ill.startDate,todayStr())):calcDur(ill.startDate,ill.endDate);
    var sympTags=''; (ill.symptoms||[]).forEach(function(s){ sympTags+='<span class="tag symp">'+esc(s)+'</span>'; });
    var dateRange=fmtDate(ill.startDate); if(ill.endDate&&!ongoing) dateRange+=' &mdash; '+fmtDate(ill.endDate);
    html+='<div class="tl-item"><div class="tl-spine"><div class="tl-dot '+(ongoing?'ill':'ok')+'"></div>'+(isLast?'':'<div class="tl-line"></div>')+'</div>'
      +'<div class="tl-card"><div class="tl-head"><div><div class="tl-name">'+esc(ill.name)+'</div><div class="tl-date">'+dateRange+'</div></div>'
      +'<div class="tl-actions"><button class="btn-ic" onclick="openEdit(\''+ill.id+'\')" aria-label="Edit"><svg fill="currentColor"><use href="#ic-edit"/></svg></button>'
      +'<button class="btn-ic" onclick="askDel(\''+ill.id+'\')" aria-label="Hapus"><svg fill="currentColor"><use href="#ic-trash"/></svg></button></div></div>'
      +(sympTags?'<div class="tags-wrap">'+sympTags+'</div>':'')
      +'<div class="tl-foot"><span class="dur-badge '+(ongoing?'ill':'')+'">'+( ongoing?'Sedang sakit':('&#10003; '+durDays+' hari'))+'</span>'
      +'<span class="tl-ago">'+agoTxt(ill.startDate)+'</span></div>'
      +(ill.notes?'<div class="tl-note">'+esc(ill.notes)+'</div>':'')
      +'</div></div>';
  }
  el.innerHTML=html;
}

function buildFreq(type,data){ var src=data||appData, freq={}; src.forEach(function(i){ if(type==='illness'){freq[i.name]=(freq[i.name]||0)+1;}else{(i.symptoms||[]).forEach(function(s){freq[s]=(freq[s]||0)+1;});} }); return Object.keys(freq).map(function(k){return[k,freq[k]];}).sort(function(a,b){return b[1]-a[1];}); }

function renderInsight(elId) {
  var el=document.getElementById(elId); if(!el||appData.length<2){if(el)el.innerHTML='';return;}
  var allAsc=sortDesc(appData).reverse(),sg=0;
  for(var g=1;g<allAsc.length;g++) sg+=Math.abs(diffDays(allAsc[g-1].startDate,allAsc[g].startDate));
  var avg=Math.round(sg/(allAsc.length-1)),freq=buildFreq('illness'),topName=freq.length?freq[0][0]:'–',topCnt=freq.length?freq[0][1]:0;
  el.innerHTML='<div class="insight-card"><svg class="insight-icon" fill="var(--dark)"><use href="#ic-insight"/></svg><div><div class="insight-text">Kamu rata-rata sakit setiap <b>'+avg+' hari</b>.</div><div class="insight-sub">Paling sering: '+esc(topName)+' ('+topCnt+'x).</div></div></div>';
}

/* ═══ QUICK SYMPTOMS ═══ */
function renderQuickChips() {
  var html=QUICK_SYMPS.map(function(s){var sel=tempSymps.indexOf(s)!==-1;return '<button type="button" class="qchip'+(sel?' selected':'')+'" onclick="toggleQuickChip(this,\''+esc(s)+'\')">'+esc(s)+'</button>';}).join('');
  var inputVisible=document.getElementById('symp-row-input').style.display!=='none';
  html+='<button type="button" class="qchip'+(inputVisible?' selected':'')+'" onclick="toggleSympInput(this)">Lainnya ✏️</button>';
  document.getElementById('quick-symps').innerHTML=html;
}
function toggleSympInput(btn){var row=document.getElementById('symp-row-input'),visible=row.style.display!=='none';row.style.display=visible?'none':'flex';btn.classList.toggle('selected',!visible);if(!visible)document.getElementById('f-symp').focus();}
function toggleQuickChip(el,s){var idx=tempSymps.indexOf(s);if(idx===-1)tempSymps.push(s);else tempSymps.splice(idx,1);el.classList.toggle('selected',tempSymps.indexOf(s)!==-1);renderSympTags();}
function addSymp(){var inp=document.getElementById('f-symp'),v=inp.value.trim();if(!v)return;if(tempSymps.indexOf(v)===-1){tempSymps.push(v);renderSympTags();renderQuickChips();}inp.value='';inp.focus();}
function removeSymp(idx){tempSymps.splice(idx,1);renderSympTags();renderQuickChips();}
function renderSympTags(){document.getElementById('f-tags').innerHTML=tempSymps.map(function(s,i){return '<div class="tag-rm" onclick="removeSymp('+i+')">'+esc(s)+'<span class="tag-rm-x">&#10005;</span></div>';}).join('');}

/* ═══ FORM CATAT / EDIT SAKIT ═══ */
function openModal() {
  editId=null;tempSymps=[];
  document.getElementById('modal-title').textContent='Catat Sakit Baru';
  document.getElementById('f-start').value=todayStr();
  document.getElementById('f-end').value='';
  document.getElementById('f-name').value='';
  document.getElementById('f-notes').value='';
  document.getElementById('f-ongoing').checked=false;
  document.getElementById('f-end').disabled=false;
  document.getElementById('symp-row-input').style.display='none';
  renderQuickChips(); renderSympTags();
  document.getElementById('ov-form').classList.add('open');
}
function openEdit(id) {
  var ill=null; for(var i=0;i<appData.length;i++) if(appData[i].id===id){ill=appData[i];break;}
  if(!ill) return;
  editId=id; tempSymps=(ill.symptoms||[]).slice();
  document.getElementById('modal-title').textContent='Edit Data Sakit';
  document.getElementById('f-start').value=ill.startDate;
  document.getElementById('f-end').value=ill.endDate||'';
  document.getElementById('f-name').value=ill.name;
  document.getElementById('f-notes').value=ill.notes||'';
  document.getElementById('f-ongoing').checked=!!ill.ongoing;
  document.getElementById('f-end').disabled=!!ill.ongoing;
  var hasCustom=tempSymps.some(function(s){return QUICK_SYMPS.indexOf(s)===-1;});
  document.getElementById('symp-row-input').style.display=hasCustom?'flex':'none';
  renderQuickChips(); renderSympTags();
  document.getElementById('ov-form').classList.add('open');
}
function closeForm(){document.getElementById('ov-form').classList.remove('open');}
function toggleOngoing(cb){document.getElementById('f-end').disabled=cb.checked;if(cb.checked)document.getElementById('f-end').value='';}

async function saveIllness() {
  var name=document.getElementById('f-name').value.trim();
  var start=document.getElementById('f-start').value;
  var end=document.getElementById('f-end').value;
  var notes=document.getElementById('f-notes').value.trim();
  var ongoing=document.getElementById('f-ongoing').checked;
  if(!name){showToast('Nama penyakit harus diisi!');return;}
  if(!start){showToast('Tanggal mulai harus diisi!');return;}
  if(!ongoing&&end&&parseDt(end)<parseDt(start)){showToast('Tanggal sembuh tidak boleh sebelum tanggal mulai!');return;}
  if(ongoing) end='';
  var rec={id:editId||String(Date.now()),name:name,startDate:start,endDate:ongoing?null:(end||null),symptoms:tempSymps.slice(),notes:notes,ongoing:ongoing};
  if(editId){
    for(var i=0;i<appData.length;i++) if(appData[i].id===editId){appData[i]=rec;break;}
    await updateRecord(rec);
    showToast('Data diperbarui!');
  } else {
    appData.unshift(rec);
    await insertRecord(rec);
    showToast('Data disimpan!');
  }
  closeForm(); renderAll();
}

/* ═══ HAPUS DATA ═══ */
function askDel(id) {
  pendingCb=function(){doDel(id);};
  document.getElementById('cf-emoji').textContent='🗑️';
  document.getElementById('cf-title').textContent='Hapus Data?';
  document.getElementById('cf-msg').textContent='Data sakit ini akan dihapus permanen.';
  document.getElementById('cf-ok').textContent='Hapus';
  document.getElementById('ov-confirm').classList.add('open');
}
async function doDel(id) {
  await deleteRecord(id);
  appData=appData.filter(function(i){return i.id!==id;});
  renderAll(); showToast('Data dihapus');
}
function closeConfirm(){document.getElementById('ov-confirm').classList.remove('open');pendingCb=null;}
function ovClose(e,id){if(e.target===document.getElementById(id)){document.getElementById(id).classList.remove('open');if(id==='ov-confirm')pendingCb=null;}}

/* ═══ INIT ═══ */
(async function init() {
  if (!ensureWebPlatform()) return;

  var user = await requireAuth();
  if (!user) return;

  initDark();
  document.getElementById('hdr-date').textContent = new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('user-name').textContent = user.user_metadata.full_name || 'Pengguna';
  document.getElementById('user-email').textContent = user.email || '';
  var av = user.user_metadata.avatar_url;
  if (av) document.getElementById('user-avatar').src = av;

  document.getElementById('cf-ok').addEventListener('click', async function() {
    if (pendingCb) { var cb = pendingCb; pendingCb = null; await cb(); closeConfirm(); }
  });

  await loadProfile();
  await loadData();

  document.getElementById('loading-screen').classList.add('hidden');

  sb.auth.onAuthStateChange(function (event) {
    if (event === 'SIGNED_OUT') window.location.replace('../index.html');
  });
})();
</script>
