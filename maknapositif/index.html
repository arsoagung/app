<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Makna Positif">
<meta name="robots" content="noindex">
<title>Makna Positif</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1116; --s1:#161a21; --s2:#1e232c; --s3:#2a303b;
  --tx:#e8eaee; --mu:#8b93a1; --ac:#2dd4bf; --acd:#0f3d38; --ink:#04201c;
  --ok:#5ed39a; --okd:#123325; --bl:#6aa8ff; --bld:#14284a; --bad:#f47c7c;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input{font:inherit;color:inherit;border:0;outline:0;background:none}
button{cursor:pointer}
button:disabled{cursor:default}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.hide{display:none!important}

/* bar */
.bar{position:sticky;top:0;z-index:20;background:rgba(14,17,22,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:calc(env(safe-area-inset-top) + 12px) 0 10px}
.row{display:flex;align-items:center;gap:8px}
.bar h1{flex:1;font-size:19px;font-weight:800;letter-spacing:-.3px;line-height:1.2}
.bar h1 small{display:block;font-size:12px;font-weight:500;color:var(--mu);letter-spacing:0}
.ib{width:40px;height:40px;border-radius:12px;background:var(--s1);display:grid;place-items:center;color:var(--mu);transition:background .2s}
.ib:active{background:var(--s3)}
.ib.spin svg{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.search{display:flex;align-items:center;gap:10px;background:var(--s1);border-radius:12px;padding:0 12px;margin-top:10px;height:42px;color:var(--mu)}
.search input{flex:1;color:var(--tx);font-size:14px;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:var(--s1);color:var(--mu);font-size:13px;font-weight:600}
.chip b{font-weight:800;color:var(--tx);margin-left:4px}
.chip.on{background:var(--acd);color:var(--ac)}
.chip.on b{color:var(--ac)}

/* grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 0 40px}
.ep{display:block;width:100%;text-align:left;background:var(--s1);border-radius:16px;overflow:hidden;animation:in .5s var(--ease) both;animation-delay:calc(var(--i)*35ms)}
.ep:active{background:var(--s2)}
.thumb{position:relative;aspect-ratio:3/4;background:var(--s2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .none{position:absolute;inset:0;display:grid;place-items:center;color:var(--mu);font-size:12px}
.kode{position:absolute;left:8px;top:8px;padding:3px 9px;border-radius:999px;background:rgba(14,17,22,.78);font-size:11px;font-weight:800;letter-spacing:.2px}
.st{position:absolute;right:8px;top:8px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800}
.st.posted{background:var(--okd);color:var(--ok)} .st.selesai{background:var(--bld);color:var(--bl)} .st.none{background:rgba(14,17,22,.78);color:var(--mu)}
.ep .info{padding:10px 12px 13px}
.ep h3{font-size:13.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep .dt{font-size:12px;color:var(--mu);margin-top:4px}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.empty{grid-column:1/-1;padding:64px 0;text-align:center;color:var(--mu)}
.empty b{display:block;color:var(--tx);margin-bottom:4px}

/* detail */
.dhead{position:sticky;top:0;z-index:20;background:rgba(14,17,22,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:calc(env(safe-area-inset-top) + 10px) 0 10px}
.dhead .t{flex:1;min-width:0}
.dhead .t small{display:block;color:var(--mu);font-size:12px;font-weight:600}
.dhead .t h2{font-size:15px;font-weight:700;line-height:1.3}
.player{position:relative;margin:6px auto 0;width:min(100%,calc(62vh*9/16));aspect-ratio:9/16;background:#000;border-radius:18px;overflow:hidden}
.player video{width:100%;height:100%;display:block;background:#000}
.player .miss{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--mu);font-size:13px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;background:var(--s1);font-weight:700;font-size:14px;padding:0 12px;transition:background .2s,opacity .2s}
.btn:active{background:var(--s3)}
.btn.pri{background:var(--ac);color:var(--ink)}
.btn.pri:active{background:#27bfae}
.btn:disabled{opacity:.4}
.btn.busy svg{animation:sp 1s linear infinite}
.btn small{font-weight:600;font-size:12px;opacity:.75}
.shr{margin-top:10px}
.tabs{display:flex;gap:6px;background:var(--s1);padding:4px;border-radius:14px;margin:18px 0 12px}
.tab{flex:1;white-space:nowrap;padding:9px 8px;border-radius:10px;font-size:13px;font-weight:700;color:var(--mu)}
.tab.on{background:var(--s3);color:var(--tx)}
.panel{background:var(--s1);border-radius:16px;padding:16px}
.ptop{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cnt{flex:1;font-size:12px;font-weight:600;color:var(--mu)}
.cbtn{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:11px;background:var(--ac);color:var(--ink);font-size:13px;font-weight:800}
.cbtn:active{background:#27bfae}
.cbtn:disabled{background:var(--s3);color:var(--mu)}
.txt{white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.7;user-select:text;-webkit-user-select:text}
.txt.none{color:var(--mu);font-style:italic}
.nav{display:flex;gap:10px;margin:18px 0 44px}
.nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:14px;background:var(--s1);font-weight:700;font-size:13px;color:var(--mu)}
.nav button:active{background:var(--s3)}
.nav button:disabled{opacity:.35}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(20px);background:var(--tx);color:#0e1116;padding:11px 18px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--bad)}
.skel{aspect-ratio:3/4;border-radius:16px;background:var(--s1);animation:pl 1.2s ease-in-out infinite}
@keyframes pl{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>

<!-- DAFTAR -->
<div id="vList">
  <div class="bar"><div class="wrap">
    <div class="row">
      <h1>Makna Positif<small id="sub">Memuat…</small></h1>
      <button class="ib" id="bRefresh" aria-label="Muat ulang"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg></button>
    </div>
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Cari judul atau kode episode" autocomplete="off"></label>
    <div class="chips" id="chips"></div>
  </div></div>
  <div class="wrap"><div class="grid" id="grid"></div></div>
</div>

<!-- DETAIL -->
<div id="vDetail" class="hide">
  <div class="dhead"><div class="wrap">
    <div class="row">
      <button class="ib" id="bBack" aria-label="Kembali"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="t"><small id="dKode"></small><h2 id="dTitle"></h2></div>
      <button class="ib" id="bTitle" aria-label="Salin judul"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button>
    </div>
  </div></div>
  <div class="wrap">
    <div class="player" id="player"></div>
    <div class="acts">
      <button class="btn pri" id="bVid"><svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg>Unduh video</button>
      <button class="btn" id="bCov"><svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg>Unduh cover</button>
    </div>
    <div class="acts shr hide" id="shareRow">
      <button class="btn" id="bShV"><svg viewBox="0 0 24 24"><path d="M12 15V4"/><path d="m8 8 4-4 4 4"/><path d="M5 12v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Bagikan video</button>
      <button class="btn" id="bShC"><svg viewBox="0 0 24 24"><path d="M12 15V4"/><path d="m8 8 4-4 4 4"/><path d="M5 12v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Bagikan cover</button>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab" data-t="yt">YouTube</button>
      <button class="tab" data-t="tiktok">TikTok</button>
      <button class="tab" data-t="ig">Instagram</button>
    </div>
    <div class="panel" id="panel"></div>
    <div class="nav">
      <button id="bPrev"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>Sebelumnya</button>
      <button id="bNext">Berikutnya<svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* Sumber data & media: repo video-ai (harus public). Untuk uji lokal: ?base=http://localhost:8100/ */
var RAW='https://raw.githubusercontent.com/arsoagung/video-ai/main/media/';
var BASE=(new URLSearchParams(location.search).get('base')||RAW).replace(/\/?$/,'/');
var LS_DATA='mp_data_v1';

var $=function(s){return document.querySelector(s)};
var EPS=[], HAS={}, FILTER='', QUERY='', CUR=null, TAB='yt', BLOBS={};

var IC_DL='<svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg>';
var IC_LOAD='<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>';
var IC_CP='<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(m,err){var t=$('#toast');t.textContent=m;t.className='toast on'+(err?' err':'');clearTimeout(toast._t);toast._t=setTimeout(function(){t.className='toast'},2400)}
function vidUrl(k){return BASE+'video/'+k+'.mp4'}
function covUrl(k){return BASE+'cover/'+k+'.png'}
function fmtDate(s){
  var m=/(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})/.exec(s||'');if(!m)return s||'';
  var mon={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11}[m[2]];
  if(mon==null)return s;
  var d=new Date(+m[3],mon,+m[1]);
  return new Intl.DateTimeFormat('id-ID',{weekday:'short',day:'numeric',month:'short'}).format(d);
}
function natKey(k){var m=/^S(\d+)E(\d+)$/.exec(k);return m?(+m[1])*1000+(+m[2]):0}

/* ---------- ketersediaan berkas (HEAD per berkas) ---------- */
function probe(url){
  return fetch(url,{method:'HEAD',cache:'no-cache'}).then(function(r){return r.ok}).catch(function(){return false});
}
function probeAll(){
  var jobs=[];
  EPS.forEach(function(e){
    jobs.push(probe(vidUrl(e.kode)).then(function(ok){(HAS[e.kode]=HAS[e.kode]||{}).v=ok}));
    jobs.push(probe(covUrl(e.kode)).then(function(ok){(HAS[e.kode]=HAS[e.kode]||{}).c=ok}));
  });
  return Promise.all(jobs);
}
function hasMedia(e){var h=HAS[e.kode]||{};return !!(h.v||h.c)}

/* ---------- muat data ---------- */
function load(){
  var b=$('#bRefresh');b.classList.add('spin');
  return fetch(BASE+'episodes.json',{cache:'no-cache'}).then(function(r){
    if(!r.ok)throw new Error(r.status===404?'Data tidak ditemukan. Repo video-ai sudah public?':'Gagal memuat data ('+r.status+')');
    return r.json();
  }).then(function(j){
    EPS=j.episodes||[];
    try{localStorage.setItem(LS_DATA,JSON.stringify(j))}catch(e){}
    return probeAll();
  }).catch(function(e){
    toast(e.message,true);
    if(!EPS.length){
      try{var c=JSON.parse(localStorage.getItem(LS_DATA)||'null');if(c){EPS=c.episodes||[];return probeAll()}}catch(x){}
    }
  }).then(function(){
    b.classList.remove('spin');
    initFilter();renderChips();renderGrid();
    var n=EPS.filter(hasMedia).length;
    $('#sub').textContent=n+' episode siap';
    route();
  });
}

/* ---------- daftar ---------- */
function visible(){
  var q=QUERY.trim().toLowerCase();
  return EPS.filter(function(e){
    if(!hasMedia(e))return false;
    if(FILTER==='siap'&&e.status==='posted')return false;
    if(FILTER==='tayang'&&e.status!=='posted')return false;
    if(q&&e.kode.toLowerCase().indexOf(q)<0&&e.judul.toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){
    var pa=a.status==='posted',pb=b.status==='posted';
    if(pa!==pb)return pa?1:-1;
    return pa?natKey(b.kode)-natKey(a.kode):natKey(a.kode)-natKey(b.kode);
  });
}
function initFilter(){
  if(FILTER)return;
  FILTER=EPS.some(function(e){return hasMedia(e)&&e.status!=='posted'})?'siap':'all';
}
function renderChips(){
  var med=EPS.filter(hasMedia);
  var n={all:med.length,siap:med.filter(function(e){return e.status!=='posted'}).length,tayang:med.filter(function(e){return e.status==='posted'}).length};
  var o=[['siap','Siap upload'],['tayang','Sudah tayang'],['all','Semua']];
  $('#chips').innerHTML=o.map(function(x){return '<button class="chip'+(FILTER===x[0]?' on':'')+'" data-f="'+x[0]+'">'+x[1]+'<b>'+n[x[0]]+'</b></button>'}).join('');
}
function renderGrid(){
  var rows=visible();
  if(!rows.length){
    $('#grid').innerHTML='<div class="empty"><b>Belum ada episode</b>Video dan cover masuk ke folder media/ di repo video-ai.</div>';return;
  }
  $('#grid').innerHTML=rows.map(function(e,i){
    var h=HAS[e.kode]||{};
    return '<button class="ep" data-k="'+e.kode+'" style="--i:'+Math.min(i,12)+'">'+
      '<div class="thumb">'+(h.c?'<img loading="lazy" alt="" src="'+covUrl(e.kode)+'">':'<div class="none">Tanpa cover</div>')+
      '<span class="kode">'+e.kode+'</span>'+
      (h.v?'<span class="st '+(e.status==='posted'?'posted':'selesai')+'">'+(e.status==='posted'?'Tayang':'Siap')+'</span>':'<span class="st none">Tanpa video</span>')+'</div>'+
      '<div class="info"><h3>'+esc(e.judul)+'</h3><div class="dt">'+esc(fmtDate(e.tanggal))+'</div></div></button>';
  }).join('');
}

/* ---------- detail ---------- */
function find(k){return EPS.find(function(e){return e.kode===k})}
function openEp(k,mode){
  var e=find(k);if(!e){closeDetail(true);return}
  CUR=e;
  $('#vList').classList.add('hide');$('#vDetail').classList.remove('hide');
  window.scrollTo(0,0);
  if(mode==='push'&&location.hash!=='#'+k)history.pushState({k:k},'','#'+k);
  else if(mode==='replace')history.replaceState({k:k},'','#'+k);
  $('#dKode').textContent=e.kode+(e.tanggal?' · '+fmtDate(e.tanggal):'');
  $('#dTitle').textContent=e.judul;
  var h=HAS[k]||{};
  var p=$('#player');
  p.innerHTML=h.v
    ?'<video controls playsinline preload="metadata"'+(h.c?' poster="'+covUrl(k)+'"':'')+' src="'+vidUrl(k)+'"></video>'
    :'<div class="miss">Video '+k+' belum ada di repo.</div>';
  $('#bVid').disabled=!h.v;$('#bCov').disabled=!h.c;
  $('#bShV').disabled=!h.v;$('#bShC').disabled=!h.c;
  var first=['yt','tiktok','ig'].filter(function(t){return e[t]})[0];
  TAB=first||'yt';
  renderPanel();
  var list=visible(),i=list.findIndex(function(x){return x.kode===k});
  $('#bPrev').disabled=i<=0;$('#bNext').disabled=i<0||i>=list.length-1;
}
function closeDetail(replace){
  var v=$('#player video');if(v){v.pause();v.removeAttribute('src');v.load()}
  $('#player').innerHTML='';
  $('#vDetail').classList.add('hide');$('#vList').classList.remove('hide');CUR=null;
  if(replace&&location.hash)history.replaceState(null,'',location.pathname+location.search);
}
function stepEp(d){
  var list=visible(),i=list.findIndex(function(x){return CUR&&x.kode===CUR.kode});
  var n=list[i+d];if(n)openEp(n.kode,'replace');
}
function renderPanel(){
  var e=CUR;if(!e)return;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.dataset.t===TAB)});
  var txt=e[TAB]||'';
  var lbl={yt:'YouTube',tiktok:'TikTok',ig:'Instagram'}[TAB];
  $('#panel').innerHTML='<div class="ptop"><span class="cnt">'+(txt?txt.length.toLocaleString('id-ID')+' karakter':'')+'</span>'+
    '<button class="cbtn" id="cpTxt"'+(txt?'':' disabled')+'>'+IC_CP+'Salin</button></div>'+
    (txt?'<div class="txt">'+esc(txt)+'</div>':'<div class="txt none">Belum ada caption '+lbl+' untuk episode ini di sheet.</div>');
  var b=$('#cpTxt');if(txt)b.onclick=function(){copyText(txt,'Caption '+lbl+' tersalin')};
}

/* ---------- salin ---------- */
function copyText(t,msg){
  if(!t){toast('Tidak ada teks',true);return}
  var done=function(){toast(msg||'Tersalin')};
  function fb(){var a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){toast('Gagal menyalin',true)}a.remove()}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,fb)}else fb();
}

/* ---------- unduh & bagikan ---------- */
function getBlob(url){
  if(BLOBS[url])return Promise.resolve(BLOBS[url]);
  return fetch(url).then(function(r){if(!r.ok)throw new Error('Gagal mengunduh ('+r.status+')');return r.blob()}).then(function(b){BLOBS[url]=b;return b});
}
function busy(btn,on,label){
  if(on){btn._h=btn.innerHTML;btn.classList.add('busy');btn.disabled=true;btn.innerHTML=IC_LOAD+(label||'Memuat…')}
  else{btn.classList.remove('busy');btn.disabled=false;if(btn._h)btn.innerHTML=btn._h}
}
function saveBlob(blob,name){
  var u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(u)},60000);
}
function doDownload(btn,url,name,type){
  busy(btn,true,'Mengunduh…');
  getBlob(url).then(function(b){
    saveBlob(b.type?b:new Blob([b],{type:type}),name);
    toast(name+' diunduh');
  }).catch(function(e){toast(e.message,true)}).then(function(){busy(btn,false)});
}
function doShare(btn,url,name,type){
  var have=!!BLOBS[url];
  if(!have)busy(btn,true,'Menyiapkan…');
  getBlob(url).then(function(b){
    if(!have)busy(btn,false);
    var f=new File([b],name,{type:type});
    if(!(navigator.canShare&&navigator.canShare({files:[f]}))){saveBlob(b,name);toast('Perangkat tidak mendukung bagikan, berkas diunduh');return}
    return navigator.share({files:[f]}).catch(function(err){
      if(err&&err.name==='AbortError')return;
      if(err&&err.name==='NotAllowedError'){toast('Siap. Ketuk Bagikan sekali lagi.');return}
      throw err;
    });
  }).catch(function(e){busy(btn,false);toast(e.message||'Gagal membagikan',true)});
}

/* ---------- routing ---------- */
function route(){
  var k=decodeURIComponent((location.hash||'').slice(1));
  if(k&&find(k))openEp(k,false);else if(CUR||!$('#vDetail').classList.contains('hide'))closeDetail(false);
}

/* ---------- events ---------- */
$('#grid').addEventListener('click',function(ev){var b=ev.target.closest('.ep');if(b)openEp(b.dataset.k,'push')});
$('#chips').addEventListener('click',function(ev){var b=ev.target.closest('.chip');if(!b)return;FILTER=b.dataset.f;renderChips();renderGrid()});
$('#q').addEventListener('input',function(ev){QUERY=ev.target.value;renderGrid()});
$('#bRefresh').onclick=function(){HAS={};BLOBS={};load()};
$('#bBack').onclick=function(){if(history.state&&history.state.k)history.back();else closeDetail(true)};
$('#bTitle').onclick=function(){if(CUR)copyText(CUR.judul,'Judul tersalin')};
$('#tabs').addEventListener('click',function(ev){var t=ev.target.closest('.tab');if(!t)return;TAB=t.dataset.t;renderPanel()});
$('#bPrev').onclick=function(){stepEp(-1)};
$('#bNext').onclick=function(){stepEp(1)};
$('#bVid').onclick=function(){if(CUR)doDownload(this,vidUrl(CUR.kode),CUR.kode+'.mp4','video/mp4')};
$('#bCov').onclick=function(){if(CUR)doDownload(this,covUrl(CUR.kode),CUR.kode+'.png','image/png')};
$('#bShV').onclick=function(){if(CUR)doShare(this,vidUrl(CUR.kode),CUR.kode+'.mp4','video/mp4')};
$('#bShC').onclick=function(){if(CUR)doShare(this,covUrl(CUR.kode),CUR.kode+'.png','image/png')};
window.addEventListener('popstate',route);
window.addEventListener('hashchange',route);

try{ if(navigator.canShare&&navigator.canShare({files:[new File(['x'],'x.png',{type:'image/png'})]}))$('#shareRow').classList.remove('hide') }catch(e){}

/* service worker bersama (scope /app/) */
try{
  var sec=location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
  if(sec&&'serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('../sw.js').catch(function(){})});
}catch(e){}

load();
})();
</script>
</body>
</html>
