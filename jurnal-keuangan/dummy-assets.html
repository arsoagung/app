<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0f">
<title>Finance Journal — Assets (dummy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0e0f; --surface:#19191b; --surface-2:#222225; --surface-3:#2c2c30;
  --text:#ececee; --muted:#9a9a9f; --faint:#6b6b70;
  --accent:#2dd48f; --accent-ink:#0e0e0f; --accent-soft:rgba(45,212,143,.14);
  --neg:#f0786d;
  --maxw:480px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select{border:0;outline:0}
[hidden]{display:none!important}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#shell{max-width:var(--maxw);margin:0 auto;min-height:100dvh}
#view{padding:calc(14px + var(--safe-t)) 16px calc(120px + var(--safe-b))}
#view>*{animation:rise .35s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.topbar{display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:6px}
.title{font-size:20px;font-weight:800;letter-spacing:-.01em}
.tag{font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
.eyebrow{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.big{font-size:38px;font-weight:800;letter-spacing:-.025em;line-height:1.15;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;padding:3px 9px;border-radius:99px}
.pos{color:var(--accent)}.neg{color:var(--neg)}
.pill.pos{background:var(--accent-soft)}.pill.neg{background:rgba(240,120,109,.14)}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.card{background:var(--surface);border-radius:20px;padding:16px;margin-top:12px}
.sec{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:12px;padding:12px 0}
.row+.row{box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.ic{width:38px;height:38px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.grow{flex:1;min-width:0}
.nm{font-weight:700}
.sub{font-size:12px;color:var(--muted)}
.rt{text-align:right}
.chev{color:var(--faint);transition:transform .25s}
.open .chev{transform:rotate(90deg)}
.fold{display:none;padding:2px 0 8px 50px}
.open+.fold{display:block}
.mini{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex;margin-top:12px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend b{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:14px;background:var(--surface-3);font-weight:700}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sm{height:34px;padding:0 12px;font-size:12.5px;border-radius:11px}
.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 4px;scrollbar-width:none}
.chip{padding:7px 14px;border-radius:99px;background:var(--surface);font-weight:600;font-size:12.5px;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--surface-3);color:var(--text)}
.note{font-size:12px;color:var(--faint);margin:10px 4px 0}
/* tabbar */
.tabbar{position:fixed;bottom:calc(10px + var(--safe-b));left:50%;transform:translateX(-50%);width:min(calc(100% - 32px),380px);display:grid;grid-template-columns:1fr 1fr 58px 1fr 1fr;align-items:center;gap:2px;background:rgba(34,34,37,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:30px;padding:6px;z-index:10}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:46px;border-radius:23px;font-size:10.5px;font-weight:600;color:var(--faint);transition:color .2s,background .2s}
.tab .i{width:24px;height:24px}
.tab.on{color:var(--accent);background:var(--surface-3)}
.fab{width:50px;height:50px;border-radius:25px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;justify-self:center}
.fab .i{width:26px;height:26px;stroke-width:2.4}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:50%;transform:translate(-50%,100%);width:min(100%,var(--maxw));max-height:90vh;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:18px 18px calc(22px + var(--safe-b));transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:21}
.sheet.on{transform:translate(-50%,0)}
.sheet h3{margin:0 0 14px;font-size:17px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.inp{width:100%;height:46px;border-radius:14px;background:var(--surface-2);padding:0 14px}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translate(-50%,20px);background:var(--surface-3);padding:10px 16px;border-radius:14px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:30;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
svg.chart{width:100%;height:120px;display:block;margin-top:14px}
</style>
</head>
<body>
<div id="shell">
  <main id="view"></main>
  <nav class="tabbar">
    <button class="tab" data-v="nw"><svg class="i" viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg>Net Worth</button>
    <button class="tab" data-v="goals"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg>Goals</button>
    <button class="fab" id="fab" aria-label="Update"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-v="assets"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>Assets</button>
    <button class="tab" data-v="set"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Settings</button>
  </nav>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* ===== DUMMY DATA — angka mirip kondisi sekarang, tidak ada yang tersimpan ===== */
const ASSETS=[ // name, kategori
  {id:'bibit',name:'Bibit',cat:'Mutual fund'},
  {id:'pluang',name:'Pluang',cat:'Stock'},
  {id:'sdep',name:'Superbank Deposit',cat:'Time deposit'},
  {id:'sb',name:'Superbank',cat:'Cash'},
  {id:'bca',name:'BCA',cat:'Cash'},
  {id:'bni',name:'BNI',cat:'Cash'},
  {id:'gopay',name:'GoPay',cat:'Cash'},
  {id:'jago',name:'Jago',cat:'Cash'}
];
// value = saldo sekarang, mp = profit bulan ini, flow = uang masuk bulan ini (net), tp = profit total sejak mulai
const GOALS=[
  {id:'kael',name:"Kael's Education",icon:'cap',color:'#2dd48f',ret:true,h:[
    {a:'bibit',value:27856343,mp:131240,flow:1302006,tp:2556343}]},
  {id:'em',name:'Emergency Fund',icon:'shield',color:'#38b6a8',ret:true,h:[
    {a:'bibit',value:9000000,mp:-48000,flow:-3010000,tp:312000},
    {a:'sdep',value:7000000,mp:24000,flow:6960000,tp:24000}]},
  {id:'end',name:'Endowment Fund',icon:'sprout',color:'#a3e635',ret:true,h:[
    {a:'pluang',value:63017653,mp:821000,flow:413731,tp:5017653}]},
  {id:'cash',name:'Cash',icon:'wallet',color:'#8a8a8f',ret:false,h:[
    {a:'bca',value:6200000},{a:'bni',value:2100000},{a:'gopay',value:450000},
    {a:'jago',value:3300000},{a:'sb',value:1250000}]}
];
const NW_HIST=[88.1,90.4,92.0,95.7,99.9,103.2,101.4,108.6,111.0,114.8,118.2,121.7]; // juta
/* ===== helpers ===== */
const $=s=>document.querySelector(s);
const rp=n=>'Rp '+Math.round(Math.abs(n)).toLocaleString('en-US');
const rpS=n=>(n<0?'−':'+')+rp(n);
const A=id=>ASSETS.find(a=>a.id===id);
const gv=g=>g.h.reduce((s,x)=>s+x.value,0);
const gmp=g=>g.h.reduce((s,x)=>s+(x.mp||0),0);
const gfl=g=>g.h.reduce((s,x)=>s+(x.flow||0),0);
const pct=(mp,val,fl)=>{const base=val-mp-fl+fl/2;return base>0?mp/base*100:0};
const pctS=p=>(p<0?'−':'+')+Math.abs(p).toFixed(2)+'%';
const pillHTML=(mp,p)=>`<span class="pill ${mp<0?'neg':'pos'}">${rpS(mp)} (${pctS(p)})</span>`;
const ICON={
  cap:'<path d="M3 9l9-5 9 5-9 5-9-5z"/><path d="M7 11.5V16c0 1.2 2.2 2.5 5 2.5s5-1.3 5-2.5v-4.5"/>',
  shield:'<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/>',
  sprout:'<path d="M12 21v-9"/><path d="M12 12c0-4 3-6 7-6 0 4-3 6-7 6z"/><path d="M12 14c0-3-2-5-6-5 0 3 2 5 6 5z"/>',
  wallet:'<path d="M4 7h14a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2V7z"/><path d="M4 7l11-3v3"/><circle cx="16" cy="13.5" r="1.1"/>',
  bank:'<path d="M3 10l9-6 9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/>',
  chart:'<path d="M3 17l5-5 4 4 8-9"/>',
  pie:'<path d="M12 3v9h9"/><path d="M20.5 15A9 9 0 1112 3"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
};
const ico=k=>`<svg class="i" viewBox="0 0 24 24">${ICON[k]}</svg>`;
const catIcon=c=>({'Mutual fund':'pie','Stock':'chart','Time deposit':'clock','Cash':'bank'}[c]||'wallet');
const CAT_ORDER=['Mutual fund','Stock','Time deposit','Cash'];
/* nilai & profit per aset, dijumlah dari semua goal yang memakainya */
function assetAgg(id){
  let value=0,mp=0,fl=0,tp=0,parts=[];
  GOALS.forEach(g=>g.h.filter(x=>x.a===id).forEach(x=>{value+=x.value;mp+=x.mp||0;fl+=x.flow||0;tp+=x.tp||0;parts.push({g,x})}));
  return {value,mp,fl,tp,parts};
}
const totalNW=()=>GOALS.reduce((s,g)=>s+gv(g),0);
/* ===== views ===== */
const V={
nw(){
  const total=totalNW(),mp=GOALS.reduce((s,g)=>s+gmp(g),0),fl=GOALS.reduce((s,g)=>s+gfl(g),0);
  const pts=NW_HIST.slice(0,-1).concat(total/1e6),mn=Math.min(...pts),mx=Math.max(...pts);
  const path=pts.map((v,i)=>`${i?'L':'M'}${(i/(pts.length-1)*320).toFixed(1)} ${(100-(v-mn)/(mx-mn)*90).toFixed(1)}`).join(' ');
  const bar=GOALS.map(g=>`<i style="width:${gv(g)/total*100}%;background:${g.color}"></i>`).join('');
  const leg=GOALS.map(g=>`<span><b style="background:${g.color}"></b>${g.name.split(' ')[0].replace("'s",'')} ${Math.round(gv(g)/total*100)}%</span>`).join('');
  return `<div class="topbar"><span class="title">Net Worth</span><span class="tag">Dummy</span></div>
  <div class="eyebrow">Total</div><div class="big">${rp(total)}</div>
  <div style="margin-top:8px">${pillHTML(mp,pct(mp,total,fl))} <span class="faint" style="font-size:12px;margin-left:6px">this month</span></div>
  <div class="card"><svg class="chart" viewBox="0 0 320 110" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>
  <div class="bar">${bar}</div><div class="legend">${leg}</div></div>`;
},
goals(){
  const rows=GOALS.map((g,i)=>{
    const v=gv(g),mp=gmp(g),fl=gfl(g);
    const right=g.ret?`<div class="nm">${rp(v)}</div>${pillHTML(mp,pct(mp,v,fl))}`:`<div class="nm">${rp(v)}</div><div class="sub">No return</div>`;
    const inner=g.h.map(x=>`<div class="mini"><span>${A(x.a).name}</span><span class="muted">${rp(x.value)}</span></div>`).join('');
    const mv=g.h.length>1?`<button class="btn sm" data-move="${g.id}">Move funds</button>`:'';
    return `<button class="row${S.open===g.id?' open':''}" data-open="${g.id}" style="width:100%">
      <span class="ic" style="color:${g.color}">${ico(g.icon)}</span>
      <span class="grow"><div class="nm">${g.name}</div><div class="sub">${g.h.length} ${g.h.length>1?'assets':'asset'}</div></span>
      <span class="rt">${right}</span><span class="chev"><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span></button>
      <div class="fold">${inner}${mv?`<div style="padding-top:6px">${mv}</div>`:''}</div>`}).join('');
  return `<div class="topbar"><span class="title">Goals</span><span class="tag">Dummy</span></div><div class="card" style="margin-top:4px;padding:6px 16px">${rows}</div>
  <p class="note">Tap a goal to see which assets hold its money.</p>`;
},
assets(){
  const cats=[...new Set([...CAT_ORDER,...ASSETS.map(a=>a.cat)])].filter(c=>ASSETS.some(a=>a.cat===c));
  const body=cats.map(c=>{
    const list=ASSETS.filter(a=>a.cat===c).map(a=>{
      const g=assetAgg(a.id),isCash=c==='Cash';
      const right=isCash?`<div class="nm">${rp(g.value)}</div>`:`<div class="nm">${rp(g.value)}</div>${pillHTML(g.mp,pct(g.mp,g.value,g.fl))}`;
      const inner=g.parts.map(p=>`<div class="mini"><span>${p.g.name}</span><span class="muted">${rp(p.x.value)}</span></div>`).join('');
      return `<button class="row${S.openA===a.id?' open':''}" data-opena="${a.id}" style="width:100%">
        <span class="ic" style="color:var(--accent)">${ico(catIcon(a.cat))}</span>
        <span class="grow"><div class="nm">${a.name}</div><div class="sub">${g.parts.length} ${g.parts.length===1?'goal':'goals'}</div></span>
        <span class="rt">${right}</span><span class="chev"><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span></button>
        <div class="fold">${inner}${isCash?'':`<div class="mini"><span class="faint">Total profit</span><span class="${g.tp<0?'neg':'pos'}">${rpS(g.tp)}</span></div>`}</div>`}).join('');
    const sum=ASSETS.filter(a=>a.cat===c).reduce((s,a)=>s+assetAgg(a.id).value,0);
    return `<div class="sec"><span>${c}</span><span>${rp(sum)}</span></div><div class="card" style="margin-top:0;padding:6px 16px">${list}</div>`}).join('');
  return `<div class="topbar"><span class="title">Assets</span><span class="tag">Dummy</span></div>${body}
  <p class="note">An asset can hold money for several goals. Its profit is the sum of all of them.</p>`;
},
set(){
  const as=ASSETS.map(a=>`<button class="row" data-edit="${a.id}" style="width:100%"><span class="ic" style="color:var(--accent)">${ico(catIcon(a.cat))}</span>
    <span class="grow"><div class="nm">${a.name}</div><div class="sub">${a.cat}</div></span><span class="chev"><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span></button>`).join('');
  const gs=GOALS.map(g=>`<div class="card" style="margin-top:10px">
    <div style="display:flex;align-items:center;gap:10px"><span style="color:${g.color}">${ico(g.icon)}</span><span class="nm grow">${g.name}</span>
    <button class="btn sm" data-addto="${g.id}">+ Asset</button></div>
    ${g.h.map(x=>`<div class="mini" style="margin-top:4px"><span>${A(x.a).name}</span><span class="muted">${rp(x.value)}</span></div>`).join('')}</div>`).join('');
  return `<div class="topbar"><span class="title">Settings</span><span class="tag">Dummy</span></div>
  <div class="sec"><span>Assets</span><button class="btn sm pri" data-newasset>+ New asset</button></div>
  <div class="card" style="margin-top:0;padding:6px 16px">${as}</div>
  <div class="sec"><span>Goal composition</span></div>${gs}
  <p class="note">Choose which assets hold each goal's money. Moving funds between assets of the same goal never changes its return.</p>`;
}};
/* ===== sheets (dummy: nothing is saved) ===== */
const goalOpts=()=>GOALS.map(g=>`<option value="${g.id}">${g.name}</option>`).join('');
const assetOpts=ids=>ASSETS.filter(a=>!ids||ids.includes(a.id)).map(a=>`<option value="${a.id}">${a.name}</option>`).join('');
function sheet(html){$('#sheet').innerHTML=html;$('#sheet').classList.add('on');$('#scrim').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on');$('#scrim').classList.remove('on')}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
const done=t=>`<div style="display:flex;gap:10px;margin-top:16px"><button class="btn" style="flex:1" data-close>Cancel</button><button class="btn pri" style="flex:1" data-done="${t}">Save</button></div>`;
function updateSheet(){
  sheet(`<h3>Update balance</h3>
  <div class="field"><label>Goal</label><select class="inp" id="ug">${goalOpts()}</select></div>
  <div class="field" id="uaw"><label>Asset</label><select class="inp" id="ua"></select></div>
  <div class="field"><label>Balance now</label><input class="inp" inputmode="numeric" placeholder="Rp 0"></div>${done('Balance updated')}`);
  const fill=()=>{const g=GOALS.find(x=>x.id===$('#ug').value);$('#ua').innerHTML=g.h.map(x=>`<option>${A(x.a).name}</option>`).join('');$('#uaw').hidden=g.h.length<2};
  $('#ug').onchange=fill;fill();
}
function moveSheet(gid){
  const g=GOALS.find(x=>x.id===gid),ids=g.h.map(x=>x.a);
  sheet(`<h3>Move funds · ${g.name}</h3>
  <div class="field"><label>From</label><select class="inp">${assetOpts(ids)}</select></div>
  <div class="field"><label>To</label><select class="inp">${assetOpts(ids).split('</option>').reverse().join('</option>')}</select></div>
  <div class="field"><label>Amount</label><input class="inp" inputmode="numeric" placeholder="Rp 0"></div>
  <p class="note" style="margin:0">Both assets belong to this goal, so its return is not affected.</p>${done('Funds moved')}`);
}
function newAssetSheet(id){
  const a=id?A(id):{name:'',cat:''};
  sheet(`<h3>${id?'Edit asset':'New asset'}</h3>
  <div class="field"><label>Name</label><input class="inp" value="${a.name}" placeholder="e.g. Superbank Deposit"></div>
  <div class="field"><label>Category</label><input class="inp" list="cats" value="${a.cat}" placeholder="Type or pick, e.g. Time deposit">
  <datalist id="cats">${[...new Set(ASSETS.map(x=>x.cat))].map(c=>`<option>${c}</option>`).join('')}</datalist></div>
  <p class="note" style="margin:0">New categories just work — type any name.</p>${done(id?'Asset updated':'Asset added')}`);
}
function addToGoalSheet(gid){
  const g=GOALS.find(x=>x.id===gid);
  sheet(`<h3>Add asset to ${g.name}</h3>
  <div class="field"><label>Asset</label><select class="inp">${assetOpts(ASSETS.filter(a=>!g.h.some(x=>x.a===a.id)).map(a=>a.id))}</select></div>
  <div class="field"><label>Starting balance</label><input class="inp" inputmode="numeric" placeholder="Rp 0"></div>${done('Asset added to goal')}`);
}
/* ===== wiring ===== */
const S={v:'nw',open:null,openA:null};
function render(){
  $('#view').innerHTML=V[S.v]();
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===S.v));
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,#scrim');if(!t)return;
  if(t.dataset.v){S.v=t.dataset.v;render();scrollTo(0,0)}
  else if(t.id==='fab')updateSheet();
  else if(t.dataset.open){S.open=S.open===t.dataset.open?null:t.dataset.open;render()}
  else if(t.dataset.opena){S.openA=S.openA===t.dataset.opena?null:t.dataset.opena;render()}
  else if(t.dataset.move)moveSheet(t.dataset.move);
  else if(t.dataset.newasset!==undefined)newAssetSheet();
  else if(t.dataset.edit)newAssetSheet(t.dataset.edit);
  else if(t.dataset.addto)addToGoalSheet(t.dataset.addto);
  else if(t.dataset.done){closeSheet();toast(t.dataset.done+' (dummy)')}
  else if(t.dataset.close!==undefined||t.id==='scrim')closeSheet();
});
render();
</script>
</body>
</html>
